function skFlowErr(m){var e=document.getElementById('fe');if(e)e.innerHTML='<div class="err">'+esc(m)+'</div>';}
ACT.skfcancel=function(){SK.flow=null;skList();};
ACT.skfstart=function(kind){
  if(kind==='chit'){
    if(!S.owner||S.ro){toast('Only the treasurer who owns this app can create a chit.','warn');return;}
    SK.flow={t:'chit',step:'t0',d:{}};
  }else{
    var cs=list('chits').filter(function(c){return !c.archived&&c.status!=='closed';});
    if(!cs.length){ACT.skclose();ACT.newparty({getAttribute:function(){return null;}});return;}
    var today=todayIn(phoneTz());
    SK.flow={t:'party',step:cs.length>1?0:1,d:{cid:cs[0].id,date:nextDow(today,6),time:'16:00',dress:skPickTheme()||''}};
  }
  skList();
};
ACT.skt0=function(){var f=SK.flow;if(!f||f.t!=='chit')return;var v=val('ftn').trim().slice(0,30);if(!v){skFlowErr('Type the treasurer\u2019s name.');return;}f.d.treName=v;f.step='t1';skList();};
ACT.skt1=function(t,id){var f=SK.flow;if(!f||f.t!=='chit'||f.step!=='t1')return;if(id==='yes'){f.d.isTre=true;f.step=1;}else{f.d.isTre=false;f.step='t2';}skList();};
ACT.skt2=function(){var f=SK.flow;if(!f||f.t!=='chit')return;var v=val('fmn').trim().slice(0,30);if(!v){skFlowErr('Type your name.');return;}f.d.meName=v;f.step=1;skList();};
ACT.skfm=function(t,id){var f=SK.flow;if(!f||f.t!=='chit')return;f.d.first=id;f.step=2;skList();};
ACT.skfn=function(){
  var f=SK.flow;if(!f||f.t!=='chit')return;
  if(f.step===2){
    var v=val('fcontrib');if(!(parseFloat(v)>0)){skFlowErr('Type the amount, like 1000.');return;}
    f.d.contrib=v;f.step=3;skList();return;
  }
  if(f.step===3){
    var names=val('fnames').split(/[\n,;]+/).map(function(x){return x.replace(/^\s*(\d+[.)]|[-*•])\s*/,'').trim().slice(0,30);}).filter(Boolean);
    if(names.length<2){skFlowErr('Add at least two names.');return;}
    if(names.length>60){skFlowErr('The most is 60 people.');return;}
    var seen={};for(var i=0;i<names.length;i++){var k=names[i].toLowerCase();if(seen[k]){skFlowErr('Two people are called '+names[i]+'. Add a last initial to tell them apart.');return;}seen[k]=1;}
    var has=function(n){for(var j=0;j<names.length;j++)if(names[j].toLowerCase()===n.toLowerCase())return j;return -1;};
    var add=[];
    if(f.d.treName&&has(f.d.treName)<0){names.unshift(f.d.treName);add.push(f.d.treName);}
    if(!f.d.isTre&&f.d.meName&&has(f.d.meName)<0){names.push(f.d.meName);add.push(f.d.meName);}
    f.d.tre=has(f.d.treName||'');f.d.me=f.d.isTre?f.d.tre:has(f.d.meName||'');
    f.d.names=names;f.d.phones=[];f.step=4;f.d.note=add.length?add.join(' and ')+(add.length>1?' were':' was')+' not in the list, so I added '+(add.length>1?'them':'them')+' with 1 share each. You can change shares on the next page.':'';skList();
  }
};
ACT.sktre=function(t,id){var f=SK.flow;if(!f||f.t!=='chit'||f.step!=='tre')return;f.d.tre=+id;f.step=4;skList();};
ACT.skfp=function(t,id){
  var f=SK.flow;if(!f||f.t!=='chit')return;
  if(id==='now'){f.step=5;skList();return;}
  if(id==='done'){f.d.phones=f.d.names.map(function(n,i){return i===f.d.tre?'':val('fph'+i).trim();});}
  skFinishChit();
};
function skFinishChit(){
  var f=SK.flow,d=f.d,w=newWiz();
  w.first=d.first;w.year=d.first.slice(0,4);w.contrib=String(d.contrib);w.name='Our Chit';w.word='Chit';
  w.members=d.names.map(function(n,i){return {id:uid(),name:n,shares:1,phone:(d.phones&&d.phones[i])||''};});
  w.tre=w.members[d.tre].id;w.me=d.me>=0?w.members[d.me].id:'';w.collect='winner';
  var step=4,err='';
  for(var s=1;s<=3;s++){w.step=s;var e=wizCheck(w);if(e){step=s;err=e;break;}}
  w.step=step;w.err=err;
  S.wiz=w;SK.flow=null;ACT.skclose();go('wiz');toast('Please check this page, then tap Create.');
}
ACT.skpg=function(t,id){var f=SK.flow;if(!f||f.t!=='party')return;f.d.cid=id;f.step=1;skList();};
ACT.skpb=function(t,id){
  var f=SK.flow;if(!f||f.t!=='party')return;
  var v=id==='custom'?val('pbud2'):id;
  if(!(parseFloat(v)>=0)||v===''){skFlowErr('Type the total budget, like 5000.');return;}
  f.d.budget=Math.round(+v);f.step='host';skList();
};
ACT.skph=function(t,id){var f=SK.flow;if(!f||f.t!=='party'||f.step!=='host')return;f.d.host=id;f.step='kids';skList();};
ACT.skpk=function(t,id){var f=SK.flow;if(!f||f.t!=='party'||f.step!=='kids')return;f.d.kids=id==='1';f.step=2;skList();};
ACT.skpd=function(t,id){
  var f=SK.flow;if(!f||f.t!=='party')return;
  if(id==='another'){f.d.date=val('pdate2')||f.d.date;f.d.time=val('ptime2')||f.d.time;var n=skPickTheme();if(n)f.d.dress=n;skList();return;}
  if(id==='none'){f.d.date=val('pdate2')||f.d.date;f.d.time=val('ptime2')||f.d.time;f.d.dress='';skList();return;}
  var date=val('pdate2'),time=val('ptime2');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){skFlowErr('Choose the date.');return;}
  if(!/^\d{2}:\d{2}$/.test(time)){skFlowErr('Choose the time.');return;}
  var pid=mkParty({cid:f.d.cid,name:'Kitty party',date:date,time:time,dress:f.d.dress,budget:f.d.budget,by:f.d.host,kids:f.d.kids});
  if(f.d.dress)skRecordTheme(f.d.dress);
  SK.flow=null;ACT.skclose();S.pback='chit';go('party',{pid:pid});toast('Party created. Everyone is marked Coming.');
};
/* make a party for a whole chit group with everyone marked Coming */
function mkParty(o){
  var c=S.D.chits[o.cid];if(!c)return null;
  var id=o.id||uid(),me=ls('me:'+o.cid)||c.tre||null;
  var members=c.members.map(function(m){return {id:m.id,name:m.name};});
  var doc={name:o.name,date:o.date,time:o.time||'',dress:o.dress||'',budget:o.budget||0,place:o.place||'',cur:c.cur,cid:o.cid,members:members,by:o.by||me,kids:o.kids===true,xcats:[],skip:[],created:Date.now()};
  if(o.tea){doc.tea=true;doc.host=o.host||'';}
  put('parties',id,doc);
  members.forEach(function(m){put('rsvp',id+'_'+m.id,{pid:id,mid:m.id,st:'yes',mode:'all',at:isoNow()});});
  if(me)ls('mep:'+id,me);
  partyAnnounce(id,'new');
  return id;
}

function skTeaRule(cid){var d=skDoc('tea_'+cid)||skDoc('tea');return d&&d.nths&&d.nths.length?d:null;}
function teaHost(c,nt,rule){

function isWinnerNow(c){

/* ---------- calendar ---------- */
function evStamp(date,time,addMin){
  var d=new Date(date+'T'+(time||'16:00')+':00');d=new Date(d.getTime()+(addMin||0)*60000);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
}
function partyLines(p){
  var l=[];
  l.push('When: '+fmtDay(p.date)+(p.time?', '+fmtTime(p.time):''));
  if(p.place)l.push('Where: '+p.place);
  if(p.maps)l.push('Map: '+p.maps);
  if(p.dress)l.push('Dress code: '+p.dress);
  if(p.kids===true)l.push('Kids are welcome');else if(p.kids===false)l.push('Adults only');
  return l;
}
function gcalLink(p){
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent((p.tea?'\u2615 ':'\uD83C\uDF89 ')+p.name)+'&dates='+evStamp(p.date,p.time,0)+'/'+evStamp(p.date,p.time,120)+'&details='+encodeURIComponent(partyLines(p).join('\n'))+'&location='+encodeURIComponent((p.place||'')+(p.maps?' '+p.maps:''));
}
function icsOf(p){
  var esc2=function(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');};
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kitty Manager//EN','BEGIN:VEVENT','UID:'+p.id+'@kittymanager','SEQUENCE:'+(p.rsc||0),'DTSTAMP:'+evStamp(todayIn(phoneTz()),'00:00',0)+'Z',
   'DTSTART:'+evStamp(p.date,p.time,0),'DTEND:'+evStamp(p.date,p.time,120),'SUMMARY:'+esc2((p.tea?'\u2615 ':'\uD83C\uDF89 ')+p.name),'LOCATION:'+esc2((p.place||'')+(p.maps?' '+p.maps:'')),'DESCRIPTION:'+esc2(partyLines(p).join('\n')),'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
ACT.pics=function(t,id){var p=S.D.parties[id||S.pid];if(!p)return;p=Object.assign({id:id||S.pid},p);saveFile((p.name||'party').replace(/[^\w]+/g,'-')+'.ics',icsOf(p));};

ACT.chpoll=function(t){
  var P=t.getAttribute('data-p'),i=+t.getAttribute('data-i'),d=S.D.polls[P];if(!d||d.done||S.ro)return;
  var c=S.D.chits[d.cid];if(!c)return;var me=myId(c)||(S.owner?c.tre:null);if(!me||!memberById(c,me)){toast('Only members of this chit can vote.','warn');return;}

function pollEval(P){
  var d=S.D.polls[P];if(!d||d.v!==0||d.done)return;var c=S.D.chits[d.cid];if(!c)return;

/* ---------- chit sections, archive, delete ---------- */
function chitFinished(c){
  if(c.status==='closed')return true;
  try{return c.status==='running'&&c.first&&graceEnd(c,N(c)-1)<todayIn(c.tz||phoneTz());}catch(e){return false;}
}
function chitBucket(c){
  var td=todayIn(c.tz||phoneTz()),ref=null;
  if(c.archived)ref=(c.archAt||'').slice(0,10);
  else if(chitFinished(c))ref=c.status==='closed'&&c.closedAt?c.closedAt.slice(0,10):(function(){try{return graceEnd(c,N(c)-1);}catch(e){return td;}})();
  if(!ref)return 'active';
  return daysBetween(ref,td)>=30?'completed':'archive';
}
function partyBucket(p){
  var td=todayIn(phoneTz());
  if(p.archived)return 'archive';
  if(p.date&&p.date<td)return 'archive';
  return 'active';
}
function lockedPut(col,id,data){
  if(data===null)return false;
  if(['pays','proofs','outs','luck','agree'].indexOf(col)>-1&&data&&data.cid){var c=S.D.chits[data.cid];if(c&&c.archived)return true;}
  if(col==='chits'){var o=S.D.chits[id];if(o&&o.archived&&data.archived!==false)return true;}
  return false;
}

  list('msgs').filter(function(m){return m.gid===c.id;}).forEach(function(m){put('msgs',m.id,null);});

function chitCsv(c){
  var q=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"';},rows=[['Section','Name','Month','Amount','Status','Date']];
  c.members.forEach(function(m){rows.push(['Member',m.name,'',m.shares||1,'','']);});
  list('pays').filter(function(p){return p.cid===c.id;}).forEach(function(p){var m=memberById(c,p.mid);rows.push(['Payment',m?m.name:p.mid,(p.m||0)+1,fromMinor(p.amt||0,c.cur),p.st,p.date||'']);});
  if(c.draw&&c.draw.order)effOrder(c).forEach(function(o,i){var m=memberById(c,o.split('#')[0]);rows.push(['Draw','' +(m?m.name:o),i+1,'','','']);});
  return rows.map(function(r){return r.map(q).join(',');}).join('\n');

function chitLogText(c){

/* automatic clean-up of settled, archived parties (no warning, by design) */
function autoClean(){
  var td=todayIn(phoneTz()),bills=list('bills'),rs=rsvpMap();
  list('parties').forEach(function(p){
    if(partyBucket(p)!=='archive'||!canDelParty(p))return;
    var ref=p.archived?(p.archAt||'').slice(0,10):p.date;if(!ref||daysBetween(ref,td)<30)return;
    if(partyCalc(p,bills,rs).transfers.length)return;
    logRemoval(p.name,'','Removed automatically (settled)');wipeParty(p.id);
    list('msgs').filter(function(m){return m.gid===p.id;}).forEach(function(m){put('msgs',m.id,null);});
  });
}

/* ---------- one inbox for all chats ---------- */
function chMyGroups(){
  var out=[];
  list('chits').forEach(function(c){if(c.archived)return;var cx=chCtx(c.id,'c');if(cx&&cx.me&&memberById(c,cx.me))out.push(cx);});
  list('parties').forEach(function(p){if(p.archived)return;var cx=chCtx(p.id,'p');if(cx&&cx.me&&pmember(p,cx.me))out.push(cx);});
  return out;
}
function chRows(){
  var rows=[],blk=chBlk();
  chMyGroups().forEach(function(cx){
    var ms=chMsgs(cx.gid),last=ms[ms.length-1];
    rows.push({id:(cx.kind)+':'+cx.gid,peer:'',title:(cx.kind==='p'?'🎉 ':'💰 ')+cx.name,sub:last?(chName(cx,last.mid)+': '+String(last.text||'').replace(/\s+/g,' ').slice(0,60)):'No messages yet',at:last?last.at:'',unread:!!last&&last.mid!==cx.me&&last.at>(ls('rd:'+cx.gid)||'')});
    cx.members.forEach(function(m){
      if(m.id===cx.me)return;var d=chDms(cx.gid,cx.me,m.id),last2=d[d.length-1];if(!last2)return;
      if(blk.indexOf(cx.gid+':'+m.id)>-1)return;
      rows.push({id:cx.kind+':'+cx.gid,peer:m.id,title:m.name,sub:(last2.from===cx.me?'You: ':'')+String(last2.text||'').replace(/\s+/g,' ').slice(0,60),group:cx.name,at:last2.at,unread:last2.from!==cx.me&&last2.at>(ls('rd:'+cx.gid+':'+m.id)||'')});
    });
  });
  rows.sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});
  return rows;
}

/* ---------- Sakhi takes part in the chat ---------- */
function chPostSk(cx,text){
  var act=null,m=/\n?ACTIONS\s*(\{[\s\S]*\})\s*$/.exec(text);
  if(m){try{act=JSON.parse(m[1]);}catch(e){act=null;}text=text.slice(0,m.index).trim();}
  var id=cx.gid+'_'+Date.now().toString(36)+uid().slice(0,3),doc={gid:cx.gid,mid:'sakhi',text:String(text).slice(0,700),at:isoNow()};
  if(act){
    var a={};
    if(Array.isArray(act.places))a.places=act.places.slice(0,3).map(function(x){return String(x).slice(0,50);}).filter(Boolean);
    if(act.dress)a.dress=String(act.dress).slice(0,50);
    if(/^\d{4}-\d{2}-\d{2}$/.test(act.date||''))a.date=act.date;
    if(/^\d{2}:\d{2}$/.test(act.time||''))a.time=act.time;
    if(act.title)a.title=String(act.title).slice(0,40);
    if(a.places&&!a.places.length)delete a.places;
    if(Object.keys(a).length)doc.act=a;
  }
  put('msgs',id,doc);
}
function chSakhiBrief(cx,follow,recent){
  var info='';
  if(cx.kind==='p'){var p=S.D.parties[cx.gid];if(p)info=' Party facts: name '+p.name+', date '+(p.date||'not set')+', time '+(p.time||'not set')+', place '+(p.place||'not set')+', dress code '+(p.dress||'not set')+', budget '+(p.budget||'not set')+', kids '+(p.kids===true?'allowed':p.kids===false?'not allowed':'not decided')+', people invited '+p.members.length+'.';}

عة قراءتها. للأمور الحساسة استخدموا واتساب.","Hanya anda berdua nampak sembang ini dalam aplikasi. Ia tidak sepenuhnya peribadi: sesiapa yang boleh membuka pangkalan data kumpulan boleh membacanya. Untuk perkara sensitif, gunakan WhatsApp.","இந்த அரட்டையை செயலியில் நீங்கள் இருவர் மட்டுமே பார்க்கிறீர்கள். இது முழுமையாகத் தனிப்பட்டது அல்ல: குழுவின் தரவுத்தளத்தைத் திறக்கக்கூடிய யாரும் இதைப் படிக்க முடியும். முக்கியமானவற்றுக்கு WhatsApp பயன்படுத்துங்கள்.","このチャットはアプリ内で二人だけに表示されます。ただし完全に非公開ではなく、グループのデータベースを開ける人は読むことができます。大切な内容はWhatsAppをお使いください。"],"Sakhi: On (call her with @Sakhi)":["Sakhi：已开启（用 @Sakhi 呼叫她）","Sakhi: مفعّلة (نادِها بـ @Sakhi)","Sakhi: Hidup (panggil dengan @Sakhi)","Sakhi: இயக்கத்தில் (@Sakhi என்று அழைக்கவும்)","Sakhi：オン（@Sakhi で呼び出し）"],"Sakhi: Off":["Sakhi：已关闭","Sakhi: متوقفة","Sakhi: Mati","Sakhi: நிறுத்தப்பட்டது","Sakhi：オフ"],"Sakhi is asking to join":["Sakhi 请求加入","Sakhi تطلب الانضمام","Sakhi meminta untuk sertai","Sakhi சேரக் கேட்கிறார்","Sakhi が参加を求めています"],"Yes, she can join":["是的，可以加入","نعم، يمكنها الانضمام","Ya, dia boleh sertai","ஆம், அவர் சேரலாம்","はい、参加してもらいます"],"No":["否","لا","Tidak","இல்லை","いいえ"],"Turn off":["关闭","إيقاف","Matikan","நிறுத்து","オフにする"],"Turn on":["开启","تشغيل","Hidupkan","இயக்கு","オンにする"],"Only the treasurer or party host can turn Sakhi on.":["只有财务或聚会主办人可以开启 Sakhi。","يمكن لأمين الصندوق أو مضيف الحفلة فقط تشغيل Sakhi.","Hanya bendahari atau tuan rumah parti boleh menghidupkan Sakhi.","பொருளாளர் அல்லது பார்ட்டி நடத்துபவர் மட்டுமே Sakhi-ஐ இயக்க முடியும்.","Sakhi をオンにできるのは会計係かパーティーの幹事だけです。"],"Sakhi is off in this chat. The treasurer or host can turn her on.":["此聊天中 Sakhi 已关闭。财务或主办人可以开启。","Sakhi متوقفة في هذه الدردشة. يمكن لأمين الصندوق أو المضيف تشغيلها.","Sakhi dimatikan dalam sembang ini. Bendahari atau tuan rumah boleh menghidupkannya.","இந்த அரட்டையில் Sakhi நிறுத்தப்பட்டுள்ளது. பொருளாளர் அல்லது நடத்துபவர் இயக்கலாம்.","このチャットでは Sakhi がオフです。会計係か幹事がオンにできます。"],"You can read the chat but not write in it.":["你可以阅读聊天，但不能发言。","يمكنك قرا hari)","அனைவருக்கும் குறிப்புகளைக் காட்டு (பொருளாளர்)","全員のヒントを表示（会計係）"],"Sakhi uses Claude. A ChatGPT back-up is available in the website version.":["Sakhi 使用 Claude。网页版另有 ChatGPT 备用。","تستخدم Sakhi نموذج Claude. تتوفر نسخة احتياطية ChatGPT في نسخة الموقع.","Sakhi menggunakan Claude. Sandaran ChatGPT tersedia dalam versi laman web.","Sakhi, Claude-ஐப் பயன்படுத்துகிறார். இணையதளப் பதிப்பில் ChatGPT மாற்றாகக் கிடைக்கிறது.","Sakhi は Claude を使います。ウェブ版では ChatGPT がバックアップとして使えます。"],"Settings":["设置","الإعدادات","Tetapan","அமைப்புகள்","設定"],"Set Tea and Samosa days":["设置茶与萨莫萨日","تحديد أيام الشاي والسمبوسة","Tetapkan hari Teh dan Samosa","டீயும் சமோசாவும் நாட்களை அமை","ティーとサモサの日を設定"],"For children at a party: bring them with a small corner of toys or colours, or let two trusted members mind them in another room, or share the cost of a helper you know. Keep emergency numbers and allergy notes with you, and let only known people pick them up. Please check any daycare yourself.":["带孩子参加聚会：可以为他们准备一个放玩具或彩笔的小角落，或让两位信任的成员在另一个房间照看，或分担一位你认识的看护人的费用。请随身携带紧急联系电话和过敏说明，只让认识的人接走孩子。托管机构请自行核实。","للأطفال في الحفلة: أحضريهم مع ركن صغير للألعاب أو الألوان، أو دعي عضوتين موثوقتين تعتنيان بهم في غرفة أخرى، أو تقاسمي تكلفة مساعدة تعرفينها. احتفظي بأرقام الطوارئ وملاحظات الحساسية معك، ولا تسمحي إلا لأشخاص معروفين باصطحابهم. تحققي بنفسك من أي حضانة.","Untuk kanak-kanak di parti: bawa mereka bersama sudut kecil mainan atau warna, atau minta dua ahli yang dipercayai menjaga mereka di bilik lain, atau kongsi kos pembantu yang anda kenali. Simpan nombor kecemasan dan nota alahan bersama anda, dan hanya benarkan orang yang dikenali menjemput mereka. Sila semak sendiri mana-mana pusat jagaan.","பார்ட்டியில் குழந்தைகளுக்காக: பொம்மைகள் அல்லது வண்ணங்களுடன் ஒரு சிறிய மூலையை அமைத்துக் கொண்டு வாருங்கள்; அல்லது நம்பகமான இரண்டு உறுப்பினர்கள் வேறு அறையில் பார்த்துக்கொள்ளட்டும்; அல்லது உங்களுக்குத் தெரிந்த ஒரு உதவியாளரின் செலவைப் பகிருங்கள். அவசர எண்களையும் ஒவ்வாமைக் குறிப்புகளையும் உங்களுடன் வைத்திருங்கள்; தெரிந்தவர்கள் மட்டுமே அவர்களை அழைத்துச் செல்லட்டும். எந்தப் பகல்நேரப் பராமரிப்பு மையத்தையும் நீங்களே சரிபார்த்துக் கொள்ளுங்கள்.","パーティーでの子どもについて：おもちゃや色鉛筆の小さなコーナーを用意して連れてくる、信頼できるメンバー2人が別室で見守る、または知っているお手伝いさんの費用を分け合う方法があります。緊急連絡先とアレルギーのメモを手元に置き、迎えに来られるのは知っている人だけにしてください。託児サービスはご自身で確認してください。"],"A woman who earns, learns and decides for herself lifts everyone around her.":["自己赚钱、学习、做主的女性，会带动身边每一个人。","المرأة التي تكسب وتتعلم وتقرر لنفسها ترفع كل من حولها.","Wanita yang berpendapatan, belajar dan membuat keputusan sendiri mengangkat semua orang di sekelilingnya.","தானே சம்பாதித்து, கற்று, முடிவெடுக்கும் பெண் தன்னைச் சுற்றியுள்ள அனைவரையும் உயர்த்துகிறாள்.","自分で稼ぎ、学び、決める女性は、まわりの人みんなを引き上げます。"],"Small savings, made by yourself, grow into big confidence.":["自己存下的小积蓄，会长成大大的自信。","المدخرات الصغيرة التي تصنعينها بنفسك تنمو لتصبح ثقة كبيرة.","Simpanan kecil yang anda buat sendiri membesar menjadi keyakinan yang besar.","நீங்களே சேமிக்கும் சிறு சேமிப்பு பெரிய தன்னம்பிக்கையாக வளர்கிறது.","自分で作った小さな貯金は、大きな自信に育ちます。"],"You do not need permission to grow. Take one step for yourself today.":["成长不需要许可。今天就为自己迈出一步。","لا تحتاجين إلى إذن لتنمي نفسك. خذي اليوم خطوة واحدة لنفسك.","Anda tidak perlukan kebenaran untuk berkembang. Ambil satu langkah untuk diri anda hari ini.","வளர உங்களுக்கு அனுமதி தேவையில்லை. இன்று உங்களுக்காக ஒரு அடி எடுத்து வையுங்கள்.","成長するのに許可はいりません。今日、自分のために一歩踏み出しましょう。"],"Learning a new skill is the best gift you can give yourself.":["学一项新技能，是送给自己最好的礼物。","تعلّم مهارة جديدة هو أفضل هدية تقدمينها لنفسك.","Mempelajari kemahiran baharu ialah hadiah terbaik untuk diri sendiri.","புதிய திறமையைக் கற்பது உங்களுக்கு நீங்களே தரக்கூடிய சிறந்த பரிசு.","新しいスキルを学ぶことは、自分への最高の贈り物です。"],"Strong women help each other rise. Look around this circle, you are not alone.":["坚强的女性互相扶持。看看这个圈子，你并不孤单。","النساء القويات يساعدن بعضهن على النهوض. انظري حول هذه الدائرة، لست وحدك.","Wanita yang kuat membantu satu sama lain bangkit. Lihat sekeliling kumpulan ini, anda tidak keseorangan.","வலிமையான பெண்கள் ஒருவருக்கொருவர اهما قوة.","Anda boleh lembut dan tegas pada masa yang sama. Kedua-duanya kekuatan.","நீங்கள் மென்மையாகவும் உறுதியாகவும் ஒரே நேரத்தில் இருக்கலாம். இரண்டுமே பலம்தான்.","やさしさと毅然とした態度は両立できます。どちらも強みです。"],"Do not compare your first chapter with someone else’s tenth.":["别把你的第一章和别人的第十章比。","لا تقارني فصلك الأول بالفصل العاشر لغيرك.","Jangan banding bab pertama anda dengan bab kesepuluh orang lain.","உங்கள் முதல் அத்தியாயத்தை மற்றவரின் பத்தாவது அத்தியாயத்துடன் ஒப்பிடாதீர்கள்.","自分の第1章を、他の人の第10章と比べないで。"],"A group of women who trust each other can do what no bank will do for them.":["一群彼此信任的女性，能做到任何银行都不会为她们做的事。","مجموعة نساء يثقن ببعضهن تفعل ما لن يفعله أي بنك لهن.","Sekumpulan wanita yang saling mempercayai boleh melakukan apa yang tiada bank akan lakukan untuk mereka.","ஒருவரை ஒருவர் நம்பும் பெண்கள் குழு, எந்த வங்கியும் செய்யாததைச் செய்ய முடியும்.","互いに信頼し合う女性たちのグループは、どんな銀行にもできないことができます。"],"Rest is not weakness. A tired woman cannot lead, and you are leading many things.":["休息不是软弱。疲惫的人无法带领他人，而你正带领着许多事。","الراحة ليست ضعفًا. المرأة المرهقة لا تستطيع القيادة، وأنتِ تقودين أشياء كثيرة.","Berehat bukan kelemahan. Wanita yang letih tidak dapat memimpin, dan anda sedang memimpin banyak perkara.","ஓய்வு பலவீனம் அல்ல. களைத்த பெண்ணால் வழிநடத்த முடியாது, நீங்களோ பலவற்றை வழிநடத்துகிறீர்கள்.","休むことは弱さではありません。疲れていては導けませんし、あなたは多くのことを導いています。"],"Celebrate every small win. Nobody else keeps count of your effort, so you must.":["庆祝每一个小小的胜利。没有别人会记着你的付出，所以你要自己记着。","احتفلي بكل نجاح صغير. لا أحد غيرك يعدّ جهودك، لذا افعلي أنتِ.","Raikan setiap kemenangan kecil. Tiada orang lain yang mengira usaha anda, jadi anda perlu.","ஒவ்வொரு சிறு வெற்றியையும் கொண்டாடுங்கள். உங்கள் முயற்சியை வேறு யாரும் கணக்கிடமாட்டார்கள், எனவே நீங்களே செய்யுங்கள்.","小さな成功も祝いましょう。あなたの努力を数えてくれる人は他にいないので、自分で数えるのです。"],"Say “I don’t know yet” proudly. It is the first line of every success story.":["自豪地说“我还不知道”。这是每个成功故事的第一句。","قولي «لا أعرف بعد» بفخر. إنها السطر الأول في كل قصة نجاح.","Katakan “saya belum tahu” dengan bangga. Itulah y and rest.":["累了不是懒。听听身体的声音，好好休息。","لستِ كسولة حين تتعبين. أصغي إلى جسدك واسترحي.","Anda bukan malas apabila letih. Dengar badan anda dan berehat.","களைப்பாக இருக்கும்போது நீங்கள் சோம்பேறி அல்ல. உடலின் குரலைக் கேட்டு ஓய்வெடுங்கள்.","疲れているのは怠けではありません。体の声を聞いて休みましょう。"],"You have the right to do your work, but never to its results. Do your best and let go of worry about the outcome.":["你只有行动的权利，而无权要求结果。尽力而为，放下对结果的忧虑。","لكِ الحق في أداء عملك لا في ثماره. افعلي أفضل ما عندك ودعي القلق من النتيجة.","Anda berhak melakukan kerja anda, tetapi tidak berhak ke atas hasilnya. Lakukan yang terbaik dan lepaskan bimbang tentang hasilnya.","உங்கள் கடமையைச் செய்யும் உரிமை மட்டுமே உங்களுக்கு உண்டு, அதன் பலனில் ஒருபோதும் இல்லை. சிறப்பாகச் செய்து, விளைவைப் பற்றிய கவலையை விடுங்கள்.","あなたには行いの権利だけがあり、結果の権利はありません。最善を尽くし、結果への心配は手放しましょう。"],"Pleasure and pain, heat and cold come and go. They do not last. Learn to bear them calmly.":["苦乐冷热来来去去，都不会长久。学会平静地承受。","اللذة والألم والحر والبرد تأتي وتذهب ولا تدوم. تعلّمي أن تتحمليها بهدوء.","Senang dan susah, panas dan sejuk datang dan pergi. Ia tidak kekal. Belajarlah menanggungnya dengan tenang.","இன்பமும் துன்பமும், வெப்பமும் குளிரும் வந்துபோகும். அவை நிலைக்காது. அவற்றை அமைதியாகத் தாங்கக் கற்றுக்கொள்ளுங்கள்.","喜びも苦しみも、暑さも寒さも、来ては去ります。続きません。穏やかに耐えることを学びましょう。"],"The soul is never born and never dies. It is eternal and unchanging.":["灵魂从不出生，也从不死亡，它永恒不变。","الروح لا تولد ولا تموت أبدًا. إنها أبدية لا تتغير.","Roh tidak pernah lahir dan tidak pernah mati. Ia kekal dan tidak berubah.","ஆன்மா ஒருபோதும் பிறப்பதில்லை, இறப்பதில்லை. அது நிரந்தரமானது, மாறாதது.","魂は生まれることも死ぬこともありません。永遠で、変わることがありません。"],"Stay steady in success and in failure and do your duty. This evenness of mind is called yoga.":["成功与失败中都保持平稳，尽自己的本分。这种内心的平衡就叫瑜伽。","اثبتي في النجاح والفشل وأدّي واجبك. هذا الاتزان في العقل يسمى يوغا.","Tenang dalam kejayaan dan kegagalan serta tunaikan tanggungjawab anda. Keseimbangan fikiran ini dinamakan yoga.","வெற்றியிலும் தோல்வியிலும் நிலையாக இருந்து உங்கள் கடமையைச் செய்யுங்கள். மனதின் இந்தச் சமநிலையே யோகம் எனப்படும்.","成功にも失敗にも動じず、自分の務めを果たしなさい。この心の平静がヨーガと呼ばれます。"],"On this path no effort is ever wasted. Even a little of it protects you from great fear.":["在这条路上，任何努力都不会白费。哪怕一点点，也能保护你免于巨大的恐惧。","في هذا الطريق لا يضيع أي جهد. حتى القليل منه يحميك من الخوف العظيم.","Di jalan ini tiada usaha yang sia-sia. Walau sedikit, ia melindungi anda daripada ketakutan yang besar.","இந்தப் பாதையில் எந்த முயற்சியும் வீணாவதில்லை. சிறிதளவும் பெரும் பயத்திலிருந்து காக்கும்.","この道では、どんな努力も無駄になりません。少しでも大きな恐れから守ってくれます。"],"As a person puts on new clothes and gives up the old ones, the soul takes new bodies and leaves the worn-out ones.":["就像人脱下旧衣换上新衣，灵魂也舍弃衰旧的身体，进入新的身体。","كما يخلع الإنسان الثياب البالية ويلبس جديدة، تترك الروح الأجساد البالية وتتخذ أجسادًا جديدة.","Seperti seseorang menanggalkan pakaian lama dan memakai yang baharu, roh mengambil tubuh baharu dan meninggalkan yang usang.","மனிதர் பழைய ஆடைகளை விட்டு புதியவற்றை அணிவது போல, ஆன்மா தேய்ந்த உடல்களை விட்டு புதிய உடல்களை ஏற்கிறது.","人が古い服を脱いで新しい服をまとうように、魂も古びた体を離れて新しい体を得ます。"],"Do your duty without attachment. A person who works this way reaches the highest.":["不执着地尽你的本分。这样做事的人会达到最高境界。","أدّي واجبك دون تعلّق. من يعمل هكذا يبلغ الأسمى.","Tunaikan tanggungjawab anda tanpa keterikatan. Orang yang bekerja begini mencapai yang tertinggi.","பற்றில்லாமல் உங்கள் கடமையைச் செய்யுங்கள். இவ்வாறு செயல்படுபவர் உயர்ந்த நிலையை அடைகிறார்.","執着せずに務めを果たしなさい。そのように働く人は最高の境地に至ります。"],"Whatever a respected person does, others follow. Set a good example.":["受人尊敬的人怎么做，别人就跟着做。请做个好榜样。","ما يفعله الشخص المحترم يتبعه الآخرون. كوني قدوة حسنة.","Apa sahaja yang dilakukan orang yang dihormati, orang lain mengikutinya. Jadilah teladan yang baik.","மதிப்புக்குரியவர் எதைச் செய்கிறாரோ, மற்றவர்கள் அதையே பின்பற்றுவார்கள். நல்ல முன்மாதிரியாக இருங்கள்.","尊敬される人の行いを、他の人は真似ます。良い手本になりましょう。"],"It is better to do your own duty imperfectly than to do another’s duty perfectly.":["与其完美地做别人的本分，不如不完美地做自己的本分。","أداء واجبك ولو ناقصًا خير من أداء واجب غيرك على أكمل وجه.","Lebih baik menunaikan tanggungjawab sendiri dengan tidak sempurna daripada menunaikan tanggungjawab orang lain dengan sempurna.","பிறர் கடமையை முழுமையாகச் செய்வதை விட, உங்கள் கடமையைக் குறையுடன் செய்வதே சிறந்தது.","他人の務めを完璧にこなすより、自分の務めを不完全でも果たすほうが良いのです。"],"Nothing in this world purifies like knowledge.":["世上没有什么比知识更能净化人心。","لا شيء في هذا العالم يطهّر مثل المعرفة.","Tiada apa di dunia ini yang menyucikan seperti ilmu.","இவ்வுலகில் அறிவைப் போல் தூய்மைப்படுத்துவது வேறில்லை.","この世に、知識ほど人を清めるものはありません。"],"One who has faith, is devoted and keeps the senses in control gains knowledge, and soon finds deep peace.":["有信念、虔诚并能控制感官的人会获得智慧，很快找到深深的平静。","من لديه إيمان وإخلاص ويضبط حواسه ينال المعرفة ويجد قريبًا سلامًا عميقًا.","Orang yang beriman, berbakti dan mengawal pancaindera memperoleh ilmu dan tidak lama kemudian menemui kedamaian yang mendalam.","நம்பிக்கையும் பக்தியும் கொண்டு புலன்களைக் கட்டுப்படுத்துபவர் அறிவைப் பெற்று விரைவில் ஆழ்ந்த அமைதியை அடைகிறார்.","信仰を持ち、献身し、感覚を制する人は知恵を得て、やがて深い安らぎに至ります。"],"The wise see all beings with the same eye, whether a scholar, a cow, an elephant or a dog.":["智者以平等的眼光看待一切众生，无论是学者、牛、大象还是狗。","الحكماء ينظرون إلى كل الكائنات بالعين نفسها، سواء عالِم أو بقرة أو فيل أو كلب.","Orang bijak melihat semua makhluk dengan pandangan yang sama, sama ada seorang sarjana, lembu, gajah atau anjing.","ஞானிகள் அறிஞரானாலும், பசுவானாலும், யானையானாலும், நாயானாலும் எல்லா உயிர்களையும் ஒரே பார்வையில் காண்கிறார்கள்.","賢者は、学者も牛も象も犬も、すべての生き物を同じ目で見ます。"],"One who acts without attachment, offering the work to God, is not touched by sin, like a lotus leaf is not wet by water.":["不执着地行事并把工作奉献给神的人，不沾罪恶，就像荷叶不沾水。","من يعمل دون تعلّق ويُهدي عمله لله لا يمسّه الإثم، كما لا يبتلّ ورق اللوتس بالماء.","Orang yang bertindak tanpa keterikatan, mempersembahkan kerjanya kepada Tuhan, tidak tersentuh dosa, seperti daun teratai tidak basah oleh air.","பற்றின்றிச் செயல்பட்டு, செயலை இறைவனுக்கு அர்ப்பணிப்பவரைத் தாமரை இலையைத் தண்ணீர் நனைக்காதது போல் பாவம் தீண்டாது.","執着せず、行いを神に捧げる人は、蓮の葉が水に濡れないように、罪に染まりません。"],"Lift yourself by your own mind and do not let it pull you down. The mind can be your best friend or your worst enemy.":["用你的心智提升自己，别让它拖垮你。心可以是你最好的朋友，也可能是你最大的敌人。","ارفعي نفسك بعقلك ولا تدعيه يشدّك للأسفل. العقل قد يكون أفضل صديق لك أو ألدّ أعدائك.","Angkat diri anda dengan fikiran sendiri dan jangan biarkan ia menarik anda ke bawah. Fikiran boleh menjadi sahabat terbaik atau musuh terburuk anda.","உங்கள் மனத்தால் உங்களை உயர்த்திக்கொள்ளுங்கள், அது உங்களைக் கீழே இழுக்க விடாதீர்கள். மனம் உங்கள் சிறந்த நண்பனாகவும் இருக்கலாம், மோசமான எதிரியாகவும் இருக்கலாம்.","自分の心で自分を高め、心に引きずり下ろされてはいけません。心は最良の友にも最悪の敵にもなります。"],"Yoga removes sorrow for one who is moderate in eating, recreation, work and sleep. Balance is the key to health.":["饮食、娱乐、工作和睡眠都适度的人，瑜伽能消除其痛苦。平衡是健康的关键。","اليوغا تزيل الحزن عمّن يعتدل في الأكل والترفيه والعمل والنوم. التوازن مفتاح الصحة.","Yoga menghapuskan kesedihan bagi orang yang sederhana dalam makan, riadah, kerja dan tidur. Keseimbangan ialah kunci kesihatan.","உணவு, பொழுதுபோக்கு, வேலை, தூக்கம் ஆகியவற்றில் மிதமாக இருப்பவரின் துயரத்தை யோகம் நீக்கும். சமநிலையே ஆரோக்கியத்தின் திறவுகோல்.","食事・娯楽・仕事・睡眠を適度に保つ人から、ヨーガは悲しみを取り除きます。バランスこそ健康の鍵です。"],"The mind is restless and hard to hold, but with practice and patience it can be trained.":["心不安定，难以掌控，但通过练习和耐心可以调伏。","العقل قلق يصعب إمساكه، لكن بالممارسة والصبر يمكن تدريبه.","Fikiran gelisah dan sukar dikawal, tetapi dengan latihan dan kesabaran ia boleh dilatih.","மனம் அலைபாயக்கூடியது, பிடிக்க கடினமானது; ஆனால் பயிற்சியாலும் பொறுமையாலும் அதைப் பழக்கலாம்.","心は落ち着きがなく抑えにくいものですが、練習と忍耐で整えることができます。"],"To those who think of Me with steady devotion, I bring what they lack and protect what they have.":["对那些以坚定的虔诚思念我的人，我为他们带来所缺，保护其所有。","لمن يذكرونني بإخلاص ثابت، آتيهم بما ينقصهم وأحفظ ما لديهم.","Bagi mereka yang mengingati-Ku dengan bakti yang teguh, Aku membawa apa yang mereka kekurangan dan melindungi apa yang mereka miliki.","உறுதியான பக்தியுடன் என்னை நினைப்பவர்களுக்கு, அவர்களுக்கு இல்லாததை நான் கொண்டுவருகிறேன்; உள்ளதைக் காக்கிறேன்.","揺るがぬ信愛で私を思う者には、足りないものを与え、持つものを守ろう。"],"Whoever offers Me with love a leaf, a flower, a fruit or water, I accept that loving offering.":["无论谁怀着爱献给我一片叶、一朵花、一枚果或一捧水，我都接受那份爱的供奉。","كل من يقدّم لي بحب ورقة أو زهرة أو ثمرة أو ماء، أقبل تلك التقدمة المحبة.","Sesiapa yang mempersembahkan kepada-Ku dengan kasih sehelai daun, sekuntum bunga, sebiji buah atau air, Aku menerima persembahan yang penuh kasih itu.","அன்புடன் எனக்கு இலை, மலர், கனி அல்லது நீரை அர்ப்பணிப்பவரின் அந்த அன்புப் படையலை நான் ஏற்கிறேன்.","葉でも花でも果実でも水でも、愛を込めて捧げる者の供物を私は受け取ろう。"],"One who hates no one, who is friendly and kind, free from ego, calm in joy and sorrow and forgiving, is dear to Me.":["不憎恨任何人，友善仁慈，没有我执，在苦乐中保持平静并懂得宽恕的人，是我所珍爱的。","من لا يكره أحدًا، ودودًا رحيمًا، خاليًا من الأنا، هادئًا في الفرح والحزن، غفورًا، فهو عزيز عليّ.","Orang yang tidak membenci sesiapa, mesra dan baik hati, bebas daripada ego, tenang dalam suka dan duka serta pemaaf, dikasihi oleh-Ku.","யாரையும் வெறுக்காமல், நட்புடனும் கருணையுடனும், அகங்காரமின்றி, இன்ப துன்பங்களில் அமைதியாகவும் மன்னிப்பவராகவும் இருப்பவர் எனக்குப் பிரியமானவர்.","誰も憎まず、親しみ深く優しく、我執がなく、喜びにも悲しみにも静かで、許す人は、私に愛される。"],"One who does not disturb the world and is not disturbed by it, free from anger and fear, is dear to Me.":["不扰乱世界也不被世界扰乱，远离愤怒与恐惧的人，是我所珍爱的。","من لا يزعج العالم ولا يزعجه العالم، متحررًا من الغضب والخوف، فهو عزيز عليّ.","Orang yang tidak menggusarkan dunia dan tidak digusarkan olehnya, bebas daripada marah dan takut, dikasihi oleh-Ku.","உலகை அலைக்கழிக்காமலும் உலகால் அலைக்கழிக்கப்படாமலும், கோபம் பயம் இல்லாமலும் இருப்பவர் எனக்குப் பிரியமானவர்.","世界を乱さず、世界に乱されず、怒りと恐れから自由な人は、私に愛される。"],"Speech that is truthful, pleasant, helpful and does not hurt is the discipline of speech.":["真实、悦耳、有益且不伤人的话语，就是语言的修行。","الكلام الصادق اللطيف النافع الذي لا يؤذي هو انضباط القول.","Tutur kata yang benar, menyenangkan, bermanfaat dan tidak menyakitkan ialah disiplin berkata-kata.","உண்மையான, இனிய, பயனுள்ள, புண்படுத்தாத பேச்சே பேச்சின் தவம்.","真実で、心地よく、役に立ち、人を傷つけない言葉が、言葉の修行です。"],"If you keep your mind on Me, you will cross all difficulties by My grace.":["若你将心安放在我身上，凭我的恩典，你将度过一切困难。","إن ثبّتّ قلبك فيّ، فستعبرين كل الصعاب بفضلي.","Jika anda menumpukan fikiran kepada-Ku, anda akan melepasi segala kesukaran dengan rahmat-Ku.","உங்கள் மனத்தை என்மீது நிலைநிறுத்தினால், என் அருளால் எல்லாத் துன்பங்களையும் கடப்பீர்கள்.","心を私に向けるなら、私の恩寵によってあらゆる困難を越えられるだろう。"],"Let go of your worries and take refuge in Me alone. Do not grieve.":["放下你的忧虑，只皈依于我。不要悲伤。","دعي همومك وأحتمي بي وحدي. لا تحزني.","Lepaskan segala kebimbangan dan berlindunglah kepada-Ku sahaja. Jangan bersedih.","உங்கள் கவலைகளை விட்டுவிட்டு என்னையே சரணடையுங்கள். வருந்தாதீர்கள்.","心配事を手放し、ただ私にのみ帰依しなさい。嘆くことはない。"],"Whenever goodness fades and wrong grows strong, the divine appears to restore balance.":["每当善行衰微、邪恶兴盛，神圣便会出现以恢复平衡。","كلما ضعف الخير وقوي الشر، يظهر الإلهي ليعيد التوازن.","Setiap kali kebaikan pudar dan kejahatan menguat, yang ilahi muncul untuk memulihkan keseimbangan.","எப்போதெல்லாம் நன்மை மங்கி தீமை வலுக்கிறதோ, அப்போதெல்லாம் சமநிலையை மீட்க இறைவன் தோன்றுகிறார்.","善が衰え悪が強まるときはいつも、均衡を取り戻すために神が現れます。"],"Navratri":["九夜节","نافراتري","Navratri","நவராத்திரி","ナヴラートリ"],"Happy Navratri! May Maa Durga bless you with strength, courage and joy for nine days and always.":["九夜节快乐！愿杜尔迦女神在这九天及今后始终赐予你力量、勇气和喜悦。","نافراتري سعيدة! نسأل أن تمنحك الإلهة دورغا القوة والشجاعة والفرح تسعة أيام ودائمًا.","Selamat Navratri! Semoga Dewi Durga memberkati anda dengan kekuatan, keberanian dan kegembiraan selama sembilan hari dan sentiasa.","நவராத்திரி வாழ்த்துகள்! துர்கை அன்னை ஒன்பது நாட்களும் எப்போதும் உங்களுக்கு வலிமை, தைரியம், மகிழ்ச்சி அருளட்டும்.","ナヴラートリおめでとう！ドゥルガー女神が9日間、そしていつも、力と勇気と喜びを授けてくださいますように。"],"Dussehra":["十胜节","دوسهرا","Dussehra","தசரா","ダシェラ"],"Happy Dussehra! May good win over every worry in your life.":["十胜节快乐！愿善良战胜你生活中的一切忧虑。","دوسهرا سعيدة! ليغلب الخير كل همّ في حياتك.","Selamat Dussehra! Semoga kebaikan menewaskan setiap kebimbangan dalam hidup anda.","தசரா வாழ்த்துகள்! உங்கள் வாழ்வின் ஒவ்வொரு கவலையையும் நன்மை வெல்லட்டும்.","ダシェラおめでとう！あなたの人生のあらゆる心配に、善が勝ちますように。"],"Diwali":["排灯节","ديوالي","Deepavali","தீபாவளி","ディワリ"],"Diwali is tomorrow! Get the diyas ready. Wishing you light, sweets and happiness.":["排灯节就在明天！把油灯准备好。祝你光明、甜蜜与幸福。","ديوالي غدًا! جهّزي المصابيح. نتمنى لك النور والحلوى والسعادة.","Deepavali esok! Sediakan diya. Semoga anda diberkati cahaya, manisan dan kebahagiaan.","தீபாவளி நாளை! அகல் விளக்குகளைத் தயார் செய்யுங்கள். ஒளி, இனிப்பு, மகிழ்ச்சி உங்களுக்கு நிறையட்டும்.","ディワリは明日です！ディヤを用意しましょう。光とお菓子と幸せがありますように。"],"Happy Diwali! May the festival of lights bring health, wealth and happiness to you and your family.":["排灯节快乐！愿这光明的节日为你和家人带来健康、财富与幸福。","ديوالي سعيدة! ليجلب عيد الأنوار لك ولعائلتك الصحة والرخاء والسعادة.","Selamat Deepavali! Semoga perayaan cahaya ini membawa kesihatan, kekayaan dan kebahagiaan kepada anda sekeluarga.","தீபாவளி வாழ்த்துகள்! ஒளித் திருவிழா உங்களுக்கும் உங்கள் குடும்பத்துக்கும் ஆரோக்கியம், செல்வம், மகிழ்ச்சி தரட்டும்.","ディワリおめでとう！光の祭りが、あなたとご家族に健康と富と幸せをもたらしますように。"],"Govardhan Puja":["戈瓦尔丹节","غوفردهان بوجا","Govardhan Puja","கோவர்த்தன பூஜை","ゴーヴァルダン・プージャー"],"Happy Govardhan Puja and Gujarati New Year wishes to everyone celebrating!":["祝所有庆祝的人戈瓦尔丹节和古吉拉特新年快乐！","نتمنى غوفردهان بوجا ورأس السنة الغوجاراتية سعيدين لكل من يحتفل!","Selamat Govardhan Puja dan Tahun Baru Gujarat kepada semua yang meraikannya!","கொண்டாடும் அனைவருக்கும் கோவர்த்தன பூஜை மற்றும் குஜராத்தி புத்தாண்டு வாழ்த்துகள்!","お祝いするみなさん、ゴーヴァルダン・プージャーとグジャラート新年おめでとう！"],"Bhai Dooj":["兄妹节","بهاي دوج","Bhai Dooj","பாய் தூஜ்","バーイ・ドゥージ"],"Happy Bhai Dooj! Love and blessings to every brother and sister.":["兄妹节快乐！愿每一对兄弟姐妹都得到爱与祝福。","بهاي دوج سعيد! محبة وبركات لكل أخ وأخت.","Selamat Bhai Dooj! Kasih sayang dan restu untuk setiap abang, kakak, adik.","பாய் தூஜ் வாழ்த்துகள்! ஒவ்வொரு சகோதர சகோதரிக்கும் அன்பும் ஆசிகளும்.","バーイ・ドゥージおめでとう！すべてのきょうだいに愛と祝福を。"],"Children’s Day":["儿童节","يوم الطفل","Hari Kanak-kanak","குழந்தைகள் தினம்","子どもの日"],"Happy أكيد واتساب. تؤكدها الفائزة ويمكن لأمينة الصندوق التدخل. يرى الجميع من دفعت.","Ahli lain membayar terus kepada pemenang bulan itu. Setiap bayaran dalam talian perlu tangkap layar, sama ada bayaran UPI atau pengesahan WhatsApp. Pemenang mengesahkannya dan bendahari boleh campur tangan. Semua orang nampak siapa yang telah bayar.","மற்ற உறுப்பினர்கள் அந்த மாத வெற்றியாளருக்கு நேரடியாகச் செலுத்துவார்கள். ஒவ்வொரு ஆன்லைன் கட்டணத்துக்கும் UPI கட்டணம் அல்லது WhatsApp உறுதிப்படுத்தலின் ஸ்கிரீன்ஷாட் தேவை. வெற்றியாளர் உறுதிசெய்வார்; பொருளாளர் தலையிடலாம். யார் செலுத்தினார் என்பது அனைவருக்கும் தெரியும்.","他のメンバーはその月の当選者に直接支払います。オンライン支払いにはUPI支払いかWhatsAppの確認のスクリーンショットが必要です。当選者が確認し、会計係も介入できます。誰が払ったかは全員に見えます。"],"Late fine":["滞纳罚款","غرامة التأخير","Denda lewat","தாமத அபராதம்","遅延料"],"No fine":["无罚款","بدون غرامة","Tiada denda","அபராதம் இல்லை","なし"],"Fixed amount":["固定金额","مبلغ ثابت","Jumlah tetap","நிலையான தொகை","定額"],"Percent":["百分比","نسبة مئوية","Peratus","சதவீதம்","パーセント"],"Give the party a name.":["给聚会起个名字。","أعطي الحفلة اسمًا.","Beri nama kepada parti.","விருந்துக்கு ஒரு பெயர் கொடுங்கள்.","パーティーの名前を付けてください。"],"Pick the two tea days first, then tap Create.":["先选好两个茶会日，再点创建。","اختاري يومَي الشاي أولًا ثم اضغطي إنشاء.","Pilih dua hari minum teh dahulu, kemudian ketik Cipta.","முதலில் இரண்டு தேநீர் நாட்களைத் தேர்ந்தெடுத்து, பிறகு உருவாக்கு என்பதைத் தட்டுங்கள்.","先にお茶の日を2日選んで、「作成」を押してください。"],"You are the winner this month. The others pay you directly. Confirm each payment when the money reaches you.":["本月中签者是你。其他人会直接付给你。钱到账后请逐笔确认。","أنتِ الفائزة هذا الشهر. يدفع لكِ الآخرون مباشرة. أكّدي كل دفعة عند وصول المال.","Anda pemenang bulan ini. Yang lain membayar terus kepada anda. Sahkan setiap bayaran apabila wang sampai.","இந்த மாத வெற்றியாளர் நீங்களே. மற்றவர்கள் உங்களுக்கு நேரடியாகச் செலுத்துவார்கள். பணம் வந்ததும் ஒவ்வொரு கட்டணத்தையும் உறுதிசெய்யுங்கள்.","今月の当選者はあなたです。他のメンバーがあなたに直接支払います。お金が届いたら、それぞれ確認してください。"],"Tell the members where to pay you.":["告诉成员该把钱付到哪里。","أخبري الأعضاء أين يدفعون ل ります。"],"Save as paid":["保存为已付","حفظ كمدفوع","Simpan sebagai dibayar","செலுத்தியதாகச் சேமி","支払い済みとして保存"],"Only the name changes. Money, draw and history stay as they are. Everyone can see the change in the log.":["只改名字。金额、抽签和历史记录不变。所有人都能在日志中看到这项更改。","يتغير الاسم فقط. المال والسحب والتاريخ كما هي. يرى الجميع التغيير في السجل.","Hanya nama yang berubah. Wang, cabutan dan sejarah kekal sama. Semua orang boleh melihat perubahan dalam log.","பெயர் மட்டுமே மாறும். பணம், குலுக்கல், வரலாறு அப்படியே இருக்கும். மாற்றம் அனைவருக்கும் பதிவில் தெரியும்.","変わるのは名前だけです。お金・抽選・履歴はそのままで、変更は記録で全員に見えます。"],"New name":["新名称","الاسم الجديد","Nama baharu","புதிய பெயர்","新しい名前"],"Pick any whole number from 1 to 9999. All numbers are mixed into the draw seed, so nobody can steer it. Numbers stay hidden until the draw.":["在1到9999之间选一个整数。所有数字会混入抽签种子，所以没人能操控结果。抽签前数字保持隐藏。","اختاري أي عدد صحيح من 1 إلى 9999. تُمزج كل الأعداد في بذرة السحب فلا أحد يستطيع التحكم فيها. تبقى الأرقام مخفية حتى السحب.","Pilih mana-mana nombor bulat dari 1 hingga 9999. Semua nombor dicampur ke dalam benih cabutan, jadi tiada siapa boleh mengawalnya. Nombor kekal tersembunyi sehingga cabutan.","1 முதல் 9999 வரை ஏதேனும் முழு எண்ணைத் தேர்ந்தெடுங்கள். எல்லா எண்களும் குலுக்கல் விதையில் கலக்கப்படுவதால் யாரும் முடிவை மாற்ற முடியாது. குலுக்கல் வரை எண்கள் மறைவாக இருக்கும்.","1〜9999の整数を選んでください。すべての数字が抽選のシードに混ぜられるので、誰も結果を操作できません。抽選までは数字は非表示です。"],"Pick one for me":["帮我选一个","اختاري لي رقمًا","Pilihkan satu untuk saya","எனக்காக ஒன்றைத் தேர்ந்தெடு","おまかせで選ぶ"],"Save number":["保存号码","حفظ الرقم","Simpan nombor","எண்ணைச் சேமி","番号を保存"],"Record consent":["记录同意","تسجيل الموافقة","Rekod persetujuan","சம்மதத்தைப் பதிவு செய்","同意を記録"],"Tick the members who agreed to these rules, and say how. The log will show you recorded it, with the date. They can still sign in the app later.":["勾选同意这些规则的成员，并说明方式。日志会记下你的记录和日期。他们之后仍可在应用中登录。","ضعي علامة على الأعضاء الذين وافقوا على هذه القواعد وبيّني كيف. سيُظهر السجل أنك سجّلتِ ذلك مع التاريخ. ويمكنهن تسجيل ال ితంపై ఒక పదాన్ని గీయండి. మీ టీమ్ ఒక నిమిషంలో ఊహించాలి."],"Compliment circle":["तारीफ़ों का घेरा","ప్రశంసల వలయం"],"Each person says one kind thing about the woman on her right.":["हर कोई अपनी दाईं ओर की महिला के बारे में एक अच्छी बात कहे।","ప్రతి ఒక్కరూ తమ కుడివైపు ఉన్న మహిళ గురించి ఒక మంచి మాట చెప్పాలి."],"Type the 6-character code from the WhatsApp message.":["WhatsApp संदेश का 6 अक्षरों का कोड लिखें।","WhatsApp సందేశంలోని 6 అక్షరాల కోడ్ టైప్ చేయండి."],"No stress, come as you are is always fine too.":["कोई तनाव नहीं, जैसी हैं वैसी आ जाइए, यह भी हमेशा ठीक है।","ఒత్తిడి లేదు, మీరున్నట్లే రండి, అదీ ఎప్పుడూ సరే."],"Type the treasurer’s name.":["कोषाध्यक्ष का नाम लिखें।","ట్రెజరర్ పేరు టైప్ చేయండి."],"Suggest a Tea & Samosa party":["चाय और समोसा पार्टी सुझाएँ","టీ & సమోసా పార్టీ సూచించండి"],"Pick up to 3 dates. A poll goes to the group chat. It is confirmed when 5 people say yes for one date.":["3 तारीख़ें तक चुनें। ग्रुप चैट में पोल जाएगा। जब किसी एक तारीख़ पर 5 लोग हाँ कहेंगी तो पक्की हो जाएगी।","3 తేదీల వరకు ఎంచుకోండి. గ్రూప్ చాట్‌కు పోల్ వెళ్తుంది. ఒక తేదీకి 5 మంది అవును అంటే ఖరారవుతుంది."],"Send poll to the chat":["चैट में पोल भेजें","చాట్‌కు పోల్ పంపండి"],"Use this place":["यह जगह चुनें","ఈ ప్రదేశం వాడండి"],"A woman who knows her worth does not wait to be given a seat. She builds the table.":["जो औरत अपनी क़ीमत जानती है, वह कुर्सी मिलने का इंतज़ार नहीं करती। वह मेज़ ही बना लेती है।","తన విలువ తెలిసిన స్త్రీ సీటు ఇస్తారని ఎదురు చూడదు. ఆమె బల్లనే నిర్మిస్తుంది."],"Your savings are your freedom. Every rupee you set aside is a vote for your own future.":["आपकी बचत ही आपकी आज़ादी है। हर बचाया रुपया आपके अपने भविष्य के लिए एक वोट है।","మీ పొదుపే మీ స్వేచ్ఛ. మీరు పక్కన పెట్టే ప్రతి రూపాయి మీ భవిష్యత్తుకు ఒక ఓటు."],"Ask for the raise, the loan, the role. The answer is no only until you ask.":["वेतन बढ़ोतरी, कर्ज़, ज़िम्मेदारी माँगिए। जवाब तभी तक 'ना' है जब तक आप माँगती नहीं।","జీతం పెంపు, రుణం, పదవి అడగండి. అడిగే వరకే సమాధానం ‘కాదు’."],"Strong women lift other women. When one of us moves ahead, the road gets wider for all.":["मज़बूत औरतें दूसरी औरतों को ऊपर उठाती हैं। जब हममें से एक आगे बढ़ती है, सबके लिए रास्ता चौड़ा होता है।","బలమైన స్త్రీలు ఇతర స్త్రీలను పైకి లేపుతారు. మనలో ఒకరు ముందుకు వెళ్తే అందరికీ దారి విశాలమవుతుంది."],"You do not need permission to learn something new.":["कुछ नया सीखने के लिए आपको किसी की इजाज़त नहीं चाहिए।","కొత్తది నేర్చుకోవడానికి మీకు ఎవరి అనుమతీ అవసరం లేదు."],"Money you understand is money you control. Keep learning about yours.":["जिस पैसे को आप समझती हैं, उसे आप सँभाल पाती हैं। अपने पैसे के बारे में सीखती रहिए।","మీకు అర్థమయ్యే డబ్బు మీ అదుపులో ఉంటుంది. మీ డబ్బు గురించి నేర్చుకుంటూ ఉండండి."],"A small step every month beats a big dream that never starts.":["हर महीने का एक छोटा क़दम उस बड़े सपने से बेहतर है जो कभी शुरू ही नहीं होता।","ఎప్పటికీ మొదలుకాని పెద్ద కల కంటే, ప్రతి నెల వేసే చిన్న అడుగు మేలు."],"Your voice matters in the family, at work and in the group. Use it kindly and clearly.":["परिवार में, काम पर और समूह में आपकी आवाज़ मायने रखती है। उसे प्यार से और साफ़ तरीक़े से उठाइए।","కుటుంబంలో, పనిలో, గుంపులో మీ గొంతుకు విలువ ఉంది. దాన్ని దయగా, స్పష్టంగా వినిపించండి."],"Independence is not about being alone. It is about being able to choose.":["आत्मनिर्भरता अकेले होने का नाम नहीं है। यह चुन पाने की ताक़त है।","స్వతంత్రం అంటే ఒంటరిగా ఉండటం కాదు. ఎంచుకోగలగడం."],"Teach a girl to save and she will change her family for generations.":["एक लड़की को बचत सिखाइए, वह पीढ़ियों तक अपने परिवार को बदल देगी।","ఒక అమ్మాయికి పొదుపు నేర్పితే ఆమె తరతరాల కుటుంబాన్ని మారుస్తుంది."],"You can be gentle and firm at the same time. Both are strengths.":["आप एक साथ नर्म और दृढ़ दोनों हो सकती हैं। दोनों ही ताक़त हैं।","మీరు ఒకేసారి మృదువుగా, దృఢంగా ఉండవచ్చు. రెండూ బలాలే."],"Do not compare your first chapter with someone else’s tenth.":["अपने पहले अध्याय की तुलना किसी और के दसवें अध्याय से मत कीजिए।","మీ మొదటి అధ్యాయాన్ని మరొకరి పదవ అధ్యాయంతో పోల్చకండి."],"A group of women who trust each other can do what no bank will do for them.":["एक-दूसरे पर भरोसा करने वाली औरतों का समूह वह कर सकता है जो कोई बैंक उनके लिए नहीं करेगा।","ఒకరిపై ఒకరు నమ్మకం ఉంచిన స్త్రీల సమూహం ఏ బ్యాంకూ చేయని పని చేయగలదు."],"Rest is not weakness. A tired woman cannot lead, and you are leading many things.":["आराम कमज़ोरी नहीं है। थकी हुई औरत नेतृत्व नहीं कर सकती, और आप बहुत कुछ सँभाल रही हैं।","విశ్రాంతి బలహీనత కాదు. అలసిన స్త్రీ నడిపించలేదు, మీరు ఎన్నో నడిపిస్తున్నారు."],"Celebrate every small win. Nobody else keeps count of your effort, so you must.":["हर छोटी जीत का जश्न मनाइए। आपकी मेहनत का हिसाब कोई और नहीं रखता, इसलिए आप रखिए।","ప్రతి చిన్న గెలుపునూ జరుపుకోండి. మీ శ్రమను ఇంకెవరూ లెక్కపెట్టరు, కాబట్టి మీరే పెట్టాలి."],"Say “I don’t know yet” proudly. It is the first line of every success story.":["“मुझे अभी नहीं पता” गर्व से कहिए। यह हर सफलता की कहानी की पहली पंक्ति है।","“నాకు ఇంకా తెలియదు” అని గర్వంగా చెప్పండి. ప్రతి విజయ కథకు అదే మొదటి వాక్యం."],"Your dreams do not expire. Dust them off and begin today.":["आपके सपनों की कोई एक्सपायरी डेट नहीं होती। धूल झाड़िए और आज ही शुरू कीजिए।","మీ కలలకు గడువు ఉండదు. దుమ్ము దులిపి ఈరోజే మొదలుపెట్టండి."],"Be the woman who makes the budget, signs the papers and knows where the money goes.":["वह औरत बनिए जो बजट बनाती है, काग़ज़ों पर दस्तख़त करती है और जानती है कि पैसा कहाँ जाता है।","బడ్జెట్ వేసే, పత్రాలపై సంతకం చేసే, డబ్బు ఎక్కడికి వెళ్తుందో తెలిసిన స్త్రీగా ఉండండి."],"It is okay to say no. A clear no today saves a long sorry tomorrow.":["ना कहना ठीक है। आज का साफ़ 'ना' कल की लंबी माफ़ी से बचा लेता है।","వద్దని చెప్పడం సరే. ఈరోజు స్పష్టమైన ‘కాదు’ రేపటి పెద్ద క్షమాపణను తప్పిస్తుంది."],"Every woman who learns something new gives the next one courage.":["नया सीखने वाली हर औरत अगली औरत को हिम्मत देती है।","కొత్తది నేర్చుకునే ప్రతి స్త్రీ తర్వాతి వారికి ధైర్యం ఇస్తుంది."],"Do not wait to feel ready. Ready comes after you begin.":["तैयार महसूस होने का इंतज़ार मत कीजिए। तैयारी शुरू करने के बाद आती है।","సిద్ధంగా అనిపించే వరకు ఆగకండి. మొదలుపెట్టాకే సిద్ధత వస్తుంది."],"A kind word to yourself is also a kind of saving.":["अपने लिए एक अच्छा शब्द भी एक तरह की बचत है।","మీకు మీరే చెప్పుకునే మంచి మాట కూడా ఒక రకమైన పొదుపు."],"Together we save, together we grow. That is the whole secret of a good chit.":["साथ मिलकर बचाते हैं, साथ मिलकर बढ़ते हैं। एक अच्छी चिट का पूरा राज़ यही है।","కలిసి పొదుపు చేస్తాం, కలిసి ఎదుగుతాం. మంచి చిట్ రహస్యం అదే."],"Drink a glass of water now. Most tiredness is partly thirst.":["अभी एक गिलास पानी पीजिए। ज़्यादातर थकान थोड़ी प्यास भी होती है।","ఇప్పుడే ఒక గ్లాసు నీళ్లు తాగండి. చాలా అలసట కొంతవరకు దాహమే."],"Walk for 20 minutes today. Even a walk around the house counts.":["आज 20 मिनट टहलिए। घर में घूमना भी गिना जाता है।","ఈరోజు 20 నిమిషాలు నడవండి. ఇంట్లో తిరిగినా లెక్కే."],"Sleep is medicine. Try to switch the phone off 30 minutes before bed.":["नींद दवा है। सोने से 30 मिनट पहले फ़ोन बंद करने की कोशिश कीजिए।","నిద్ర ఒక ఔషధం. పడుకునే 30 నిమిషాల ముందు ఫోన్ ఆఫ్ చేయడానికి ప్రయత్నించండి."],"Add one colourful vegetable to today’s meal.":["आज के खाने में एक रंगीन सब्ज़ी जोड़िए।","ఈరోజు భోజనంలో ఒక రంగురంగుల కూరగాయను చేర్చండి."],"Take three slow deep breaths. In through the nose, out slowly. Do it again.":["तीन बार धीरे-धीरे गहरी साँस लीजिए। नाक से अंदर, धीरे से बाहर। फिर से कीजिए।","మూడు సార్లు నెమ్మదిగా లోతుగా శ్వాస తీసుకోండి. ముక్కుతో లోపలికి, నెమ్మదిగా బయటకు. మళ్లీ చేయండి."],"Sit straight for a minute and relax your shoulders. Most of us carry stress there.":["एक मिनट सीधे बैठिए और कंधे ढीले छोड़िए। हममें से ज़्यादातर तनाव वहीं रखती हैं।","ఒక నిమిషం నిటారుగా కూర్చుని భుజాలను వదులు చేయండి. మనలో చాలామంది ఒత్తిడిని అక్కడే మోస్తాం."],"Sunlight for 10 minutes in the morning helps your body and your mood.":["सुबह 10 मिनट की धूप शरीर और मन दोनों के लिए अच्छी है।","ఉదయం 10 నిమిషాల ఎండ మీ శరీరానికీ, మనసుకీ మేలు చేస్తుంది."],"Eat slowly and stop when you are comfortably full.":["धीरे खाइए और जब आराम से पेट भर जाए तो रुक जाइए।","నెమ్మదిగా తినండి, హాయిగా కడుపు నిండగానే ఆపండి."],"Stretch your neck, shoulders and back after long sitting.":["देर तक बैठने के बाद गर्दन, कंधों और पीठ को खींचकर स्ट्रेच कीजिए।","ఎక్కువసేపు కూర్చున్న తర్వాత మెడ, భుజాలు, వీపును స్ట్రెచ్ చేయండి."],"Keep a fruit where you can see it. You will eat it.":["फल ऐसी जगह रखिए जहाँ दिखे। आप उसे खा लेंगी।","పండును కనిపించే చోట ఉంచండి. మీరు తింటారు."],"Go easy on sugary drinks. Water, buttermilk or lemon water are kinder choices.":["मीठे पेय कम पीजिए। पानी, छाछ या नींबू पानी बेहतर विकल्प हैं।","తీపి పానీయాలు తగ్గించండి. నీళ్లు, మజ్జిగ, నిమ్మరసం మంచి ఎంపికలు."],"Talk to a friend today. Good company is good for the heart.":["आज किसी सहेली से बात कीजिए। अच्छा साथ दिल के लिए अच्छा है।","ఈరోజు ఒక స్నేహితురాలితో మాట్లాడండి. మంచి సావాసం గుండెకు మంచిది."],"Do not skip breakfast on busy days. Even something small helps.":["व्यस्त दिनों में भी नाश्ता मत छोड़िए। कुछ थोड़ा-सा भी मदद करता है।","బిజీ రోజుల్లో అల్పాహారం మానకండి. చిన్నదైనా సహాయపడుతుంది."],"Walk after meals for 10 minutes. It helps digestion.":["खाने के बाद 10 मिनट टहलिए। इससे पाचन में मदद मिलती है।","భోజనం తర్వాత 10 నిమిషాలు నడవండి. జీర్ణానికి సహాయపడుతుంది."],"Laugh at least once today. It is free and it works.":["आज कम से कम एक बार हँसिए। यह मुफ़्त है और असर करता है।","ఈరోజు కనీసం ఒక్కసారైనా నవ్వండి. ఇది ఉచితం, పనిచేస్తుంది."],"Keep a regular time for meals and sleep. Your body loves a routine.":["खाने और सोने का नियमित समय रखिए। शरीर को दिनचर्या पसंद है।","భోజనానికి, నిద్రకు క్రమమైన సమయం పెట్టుకోండి. మీ శరీరానికి దినచర్య ఇష్టం."],"Look away from the screen every 20 minutes and rest your eyes.":["हर 20 मिनट में स्क्रीन से नज़र हटाइए और आँखों को आराम दीजिए।","ప్రతి 20 నిమిషాలకు స్క్రీన్ నుండి చూపు మరల్చి కళ్లకు విశ్రాంతి ఇవ్వండి."],"Use less salt and less fried food this week.":["इस हफ़्ते नमक और तली चीज़ें कम खाइए।","ఈ వారం ఉప్పు, వేపుడు పదార్థాలు తగ్గించండి."],"Climb the stairs instead of waiting for the lift when you can.":["हो सके तो लिफ़्ट का इंतज़ार करने की बजाय सीढ़ियाँ चढ़िए।","వీలైతే లిఫ్ట్ కోసం ఎదురు చూడకుండా మెట్లు ఎక్కండి."],"Take a moment to be grateful for three things. It calms the mind.":["एक पल रुककर तीन बातों के लिए आभारी होइए। इससे मन शांत होता है।","ఒక క్షణం ఆగి మూడు విషయాలకు కృతజ్ఞత చెప్పండి. మనసు శాంతిస్తుంది."],"Women’s health checks matter. If a check-up is due, book it this week.":["महिलाओं की स्वास्थ्य जाँच ज़रूरी है। अगर जाँच बाक़ी है तो इसी हफ़्ते करवा लीजिए।","మహిళల ఆరోగ్య పరీక్షలు ముఖ్యం. చెకప్ చేయించుకోవాల్సి ఉంటే ఈ వారమే బుక్ చేయండి."],"Chew your food well. Digestion starts in the mouth.":["खाना अच्छी तरह चबाइए। पाचन मुँह से शुरू होता है।","ఆహారాన్ని బాగా నమలండి. జీర్ణక్రియ నోటిలోనే మొదలవుతుంది."],"A short prayer, music or quiet time can reset a heavy day.":["एक छोटी प्रार्थना, संगीत या थोड़ा शांत समय भारी दिन को हल्का कर सकता है।","చిన్న ప్రార్థన, సంగీతం లేదా నిశ్శబ్ద సమయం భారమైన రోజును తేలిక చేయగలదు."],"You are not lazy when you are tired. Listen to your body and rest.":["थकी हों तो आप आलसी नहीं हैं। शरीर की सुनिए और आराम कीजिए।","అలసిపోయినప్పుడు మీరు సోమరి కాదు. మీ శరీరం చెప్పేది విని విశ్రాంతి తీసుకోండి."],"You have the right to do your work, but never to its results. Do your best and let go of worry about the outcome.":["तुम्हारा अधिकार केवल कर्म पर है, उसके फल पर कभी नहीं। अपना सर्वश्रेष्ठ करो और नतीजे की चिंता छोड़ दो।","మీకు కర్మ చేసే హక్కు మాత్రమే ఉంది, ఫలితంపై ఎప్పుడూ లేదు. మీ శక్తి మేరకు చేయండి, ఫలితం గురించి చింత వదలండి."],"Pleasure and pain, heat and cold come and go. They do not last. Learn to bear them calmly.":["सुख-दुख, सर्दी-गर्मी आते-जाते हैं। वे टिकते नहीं। उन्हें शांति से सहना सीखो।","సుఖం, దుఃఖం, చలి, వేడి వస్తూ పోతూ ఉంటాయి. అవి నిలవవు. వాటిని ప్రశాంతంగా భరించడం నేర్చుకోండి."],"The soul is never born and never dies. It is eternal and unchanging.":["आत्मा न कभी जन्म लेती है, न कभी मरती है। वह शाश्वत और अपरिवर्तनीय है।","ఆత్మ ఎప్పుడూ పుట్టదు, ఎప్పుడూ చావదు. అది శాశ్వతం, మారనిది."],"Stay steady in success and in failure and do your duty. This evenness of mind is called yoga.":["सफलता और असफलता में स्थिर रहकर अपना कर्तव्य करो। मन की इस समता को योग कहते हैं।","విజయంలోనూ అపజయంలోనూ స్థిరంగా ఉండి మీ కర్తవ్యం చేయండి. ఈ సమత్వాన్నే యోగం అంటారు."],"On this path no effort is ever wasted. Even a little of it protects you from great fear.":["इस मार्ग में कोई प्रयास व्यर्थ नहीं जाता। इसका थोड़ा-सा भी बड़े भय से रक्षा करता है।","ఈ మార్గంలో ఏ ప్రయత్నమూ వృథా కాదు. కొంచెం చేసినా గొప్ప భయం నుండి కాపాడుతుంది."],"As a person puts on new clothes and gives up the old ones, the soul takes new bodies and leaves the worn-out ones.":["जैसे मनुष्य पुराने वस्त्र छोड़कर नए पहनता है, वैसे आत्मा जीर्ण शरीरों को छोड़कर नए शरीर धारण करती है।","మనిషి పాత బట్టలు విడిచి కొత్తవి ధరించినట్లు, ఆత్మ పాత శరీరాలను విడిచి కొత్త శరీరాలను ధరిస్తుంది."],"Do your duty without attachment. A person who works this way reaches the highest.":["आसक्ति के बिना अपना कर्तव्य करो। इस तरह कर्म करने वाला परम को प्राप्त होता है।","ఆసక్తి లేకుండా మీ కర్తవ్యం చేయండి. ఇలా పనిచేసేవారు పరమ స్థితిని చేరుకుంటారు."],"Whatever a respected person does, others follow. Set a good example.":["श्रेष्ठ व्यक्ति जो करता है, दूसरे उसी का अनुसरण करते हैं। अच्छा उदाहरण बनिए।","గౌరవనీయులు ఏది చేస్తే ఇతరులు అదే అనుసరిస్తారు. మంచి ఆదర్శంగా ఉండండి."],"It is better to do your own duty imperfectly than to do another’s duty perfectly.":["दूसरे का कर्तव्य भली-भाँति करने से अपना कर्तव्य अधूरा करना भी बेहतर है।","ఇతరుల కర్తవ్యాన్ని పరిపూర్ణంగా చేయడం కంటే మీ స్వంత కర్తవ్యాన్ని లోపాలతో చేయడమే మేలు."],"Nothing in this world purifies like knowledge.":["इस संसार में ज्ञान के समान पवित्र करने वाला कुछ नहीं।","ఈ లోకంలో జ్ఞానంలా పవిత్రం చేసేది మరొకటి లేదు."],"One who has faith, is devoted and keeps the senses in control gains knowledge, and soon finds deep peace.":["जो श्रद्धावान, समर्पित और इंद्रियों को वश में रखने वाला है, वह ज्ञान पाता है और शीघ्र ही गहरी शांति प्राप्त करता है।","విశ్వాసం, భక్తి కలిగి ఇంద్రియాలను అదుపులో ఉంచుకున్నవారు జ్ఞానం పొంది త్వరలో గాఢమైన శాంతిని పొందుతారు."],"The wise see all beings with the same eye, whether a scholar, a cow, an elephant or a dog.":["ज्ञानी सब प्राणियों को समान दृष्टि से देखते हैं, चाहे विद्वान हो, गाय, हाथी या कुत्ता।","జ్ఞానులు పండితుడైనా, ఆవైనా, ఏనుగైనా, కుక్కైనా అన్ని ప్రాణులను సమదృష్టితో చూస్తారు."],"One who acts without attachment, offering the work to God, is not touched by sin, like a lotus leaf is not wet by water.":["जो आसक्ति छोड़कर कर्म ईश्वर को अर्पण करता है, वह पाप से वैसे ही अछूता रहता है जैसे कमल का पत्ता पानी से।","ఆసక్తి లేకుండా కర్మను దేవునికి అర్పించేవారిని, తామరాకును నీరు తడపనట్లు, పాపం అంటదు."],"Lift yourself by your own mind and do not let it pull you down. The mind can be your best friend or your worst enemy.":["अपने मन से स्वयं को ऊपर उठाओ, उसे नीचे मत गिरने दो। मन आपका सबसे अच्छा मित्र भी हो सकता है और सबसे बड़ा शत्रु भी।","మీ మనసుతోనే మిమ్మల్ని మీరు పైకి లేపుకోండి, కిందకు లాగనివ్వకండి. మనసు మీ మంచి స్నేహితుడూ కావచ్చు, పెద్ద శత్రువూ కావచ్చు."],"Yoga removes sorrow for one who is moderate in eating, recreation, work and sleep. Balance is the key to health.":["जो खाने, मनोरंजन, काम और नींद में संयमित है, उसके दुख को योग दूर करता है। संतुलन ही स्वास्थ्य की कुंजी है।","తిండి, వినోదం, పని, నిద్రలో మితంగా ఉండేవారి దుఃఖాన్ని యోగం తొలగిస్తుంది. సమతుల్యతే ఆరోగ్యానికి కీలకం."],"The mind is restless and hard to hold, but with practice and patience it can be trained.":["मन चंचल है और उसे रोकना कठिन है, पर अभ्यास और धैर्य से उसे साधा जा सकता है।","మనసు చంచలమైనది, పట్టుకోవడం కష్టం, కానీ అభ్యాసం, ఓర్పుతో దాన్ని మలచుకోవచ్చు."],"To those who think of Me with steady devotion, I bring what they lack and protect what they have.":["जो अटल भक्ति से मेरा स्मरण करते हैं, उनकी कमी मैं पूरी करता हूँ और जो उनके पास है उसकी रक्षा करता हूँ।","స్థిరమైన భక్తితో నన్ను తలచేవారికి లేనిది నేను తెచ్చి ఇస్తాను, ఉన్నదాన్ని కాపాడతాను."],"Whoever offers Me with love a leaf, a flower, a fruit or water, I accept that loving offering.":["जो प्रेम से मुझे पत्ता, फूल, फल या जल अर्पित करता है, उस प्रेम भरी भेंट को मैं स्वीकार करता हूँ।","ఎవరైనా ప్రేమతో నాకు ఆకు, పువ్వు, పండు లేదా నీరు సమర్పిస్తే ఆ ప్రేమార్పణను నేను స్వీకరిస్తాను."],"One who hates no one, who is friendly and kind, free from ego, calm in joy and sorrow and forgiving, is dear to Me.":["जो किसी से द्वेष नहीं करता, मित्रवत और दयालु है, अहंकार से मुक्त है, सुख-दुख में शांत और क्षमाशील है, वह मुझे प्रिय है।","ఎవరినీ ద్వేషించని, స్నేహంగా దయగా ఉండే, అహంకారం లేని, సుఖదుఃఖాలలో ప్రశాంతంగా క్షమించేవారు నాకు ప్రియులు."],"One who does not disturb the world and is not disturbed by it, free from anger and fear, is dear to Me.":["जो संसार को व्याकुल नहीं करता और संसार से व्याकुल नहीं होता, क्रोध और भय से मुक्त है, वह मुझे प्रिय है।","లోకాన్ని కలత పెట్టనివారు, లోకంతో కలత చెందనివారు, కోపం భయం లేనివారు నాకు ప్రియులు."],"Speech that is truthful, pleasant, helpful and does not hurt is the discipline of speech.":["सत्य, मधुर, हितकारी और किसी को चोट न पहुँचाने वाली वाणी ही वाणी का तप है।","సత్యమైన, ఆహ్లాదకరమైన, ఉపయోగకరమైన, నొప్పించని మాటే వాక్కు తపస్సు."],"If you keep your mind on Me, you will cross all difficulties by My grace.":["यदि तुम अपना मन मुझमें लगाओगे, तो मेरी कृपा से सब कठिनाइयाँ पार कर लोगे।","మీ మనసును నాపై నిలిపితే, నా అనుగ్రహంతో అన్ని కష్టాలను దాటుతారు."],"Let go of your worries and take refuge in Me alone. Do not grieve.":["अपनी चिंताएँ छोड़ दो और केवल मेरी शरण में आओ। शोक मत करो।","మీ చింతలన్నీ వదిలి నన్నే శరణు పొందండి. దుఃఖించకండి."],"Whenever goodness fades and wrong grows strong, the divine appears to restore balance.":["जब-जब धर्म की हानि और अधर्म की वृद्धि होती है, तब-तब संतुलन लौटाने के लिए ईश्वर प्रकट होते हैं।","ఎప్పుడెప్పుడు ధర్మం క్షీణించి అధర్మం పెరుగుతుందో, అప్పుడు సమతుల్యతను నెలకొల్పడానికి దైవం అవతరిస్తుంది."],"Navratri":["नवरात्रि","నవరాత్రి"],"Happy Navratri! May Maa Durga bless you with strength, courage and joy for nine days and always.":["नवरात्रि की शुभकामनाएँ! माँ दुर्गा नौ दिन और सदा आपको शक्ति, साहस और ख़ुशी का आशीर्वाद दें।","నవరాత్రి శుభాకాంక్షలు! దుర్గామాత తొమ్మిది రోజులూ, ఎల్లప్పుడూ మీకు శక్తి, ధైర్యం, ఆనందం ప్రసాదించుగాక."],"Dussehra":["दशहरा","దసరా"],"Happy Dussehra! May good win over every worry in your life.":["दशहरा की शुभकामनाएँ! आपके जीवन की हर चिंता पर अच्छाई की जीत हो।","దసరా శుభాకాంక్షలు! మీ జీవితంలో ప్రతి చింతపై మంచి గెలుపొందుగాక."],"Diwali":["दिवाली","దీపావళి"],"Diwali is tomorrow! Get the diyas ready. Wishing you light, sweets and happiness.":["दिवाली कल है! दीये तैयार कर लीजिए। आपको रोशनी, मिठाई और ख़ुशियाँ मिलें।","దీపావళి రేపే! దీపాలు సిద్ధం చేసుకోండి. మీకు వెలుగు, మిఠాయిలు, సంతోషం కలగాలి."],"Happy Diwali! May the festival of lights bring health, wealth and happiness to you and your family.":["दिवाली की शुभकामनाएँ! रोशनी का यह त्योहार आपके और आपके परिवार के लिए सेहत, समृद्धि और ख़ुशियाँ लाए।","దీపావళి శుభాకాంక్షలు! వెలుగుల పండుగ మీకు, మీ కుటుంబానికి ఆరోగ్యం, సంపద, సంతోషం తెచ్చుగాక."],"Govardhan Puja":["गोवर्धन पूजा","గోవర్ధన పూజ"],"Happy Govardhan Puja and Gujarati New Year wishes to everyone celebrating!":["गोवर्धन पूजा और गुजराती नववर्ष की शुभकामनाएँ, मनाने वाले सभी को!","గోవర్ధన పూజ, గుజరాతీ నూతన సంవత్సర శుభాకాంక్షలు, జరుపుకునే అందరికీ!"],"Bhai Dooj":["भाई दूज","భాయ్ దూజ్"],"Happy Bhai Dooj! Love and blessings to every brother and sister.":["भाई दूज की शुभकामनाएँ! हर भाई-बहन को प्यार और आशीर्वाद।","భాయ్ దూజ్ శుభాకాంక్షలు! ప్రతి సోదర సోదరికి ప్రేమ, ఆశీస్సులు."],"Children’s Day":["बाल दिवस","బాలల దినోత్సవం"],"Happy Children’s Day! Cheers to the child in every one of us.":["बाल दिवस की शुभकामनाएँ! हम सबके भीतर के बच्चे के नाम।","బాలల దినోత్సవ శుభాకాంక్షలు! మనలో ప్రతి ఒక్కరిలోని పిల్లవాడికి అభినందనలు."],"Guru Nanak Jayanti":["गुरु नानक जयंती","గురు నానక్ జయంతి"],"Happy Guru Nanak Jayanti! May his message of honesty, service and sharing guide us.":["गुरु नानक जयंती की शुभकामनाएँ! उनका ईमानदारी, सेवा और बाँटने का संदेश हमारा मार्ग दिखाए।","గురు నానక్ జయంతి శుభాకాంక్షలు! నిజాయితీ, సేవ, పంచుకోవడం అనే ఆయన సందేశం మనకు దారి చూపుగాక."],"Christmas":["क्रिसमस","క్రిస్మస్"],"Merry Christmas! Wishing you peace, love and joy.":["क्रिसमस की शुभकामनाएँ! आपको शांति, प्यार और ख़ुशी मिले।","క్రిస్మస్ శుభాకాంక్షలు! మీకు శాంతి, ప్రేమ, ఆనందం కలగాలి."],"New Year":["नया साल","నూతన సంవత్సరం"],"Happy New Year! May this year bring good health, steady savings and many happy get-togethers.":["नया साल मुबारक! यह साल अच्छी सेहत, स्थिर बचत और ढेर सारे ख़ुशनुमा मिलन लाए।","నూతన సంవత్సర శుభాకాంక్షలు! ఈ ఏడాది మంచి ఆరోగ్యం, స్థిరమైన పొదుపు, ఎన్నో సంతోషకరమైన కలయికలు తెచ్చుగాక."],"Makar Sankranti and Pongal":["मकर संक्रांति और पोंगल","మకర సంక్రాంతి, పొంగల్"],"Happy Makar Sankranti and Pongal! May your year be full of sweetness and harvest.":["मकर संक्रांति और पोंगल की शुभकामनाएँ! आपका साल मिठास और भरपूर फ़सल से भरा हो।","మకర సంక్రాంతి, పొంగల్ శుభాకాంక్షలు! మీ ఏడాది తీపితో, పంటతో నిండిపోవాలి."],"Republic Day":["गणतंत्र दिवस","గణతంత్ర దినోత్సవం"],"Happy Republic Day! Jai Hind.":["गणतंत्र दिवस की शुभकामनाएँ! जय हिंद।","గణతంత్ర దినోత్సవ శుభాకాంక్షలు! జై హింద్."],"Maha Shivaratri":["महाशिवरात्रि","మహాశివరాత్రి"],"Happy Maha Shivaratri! Om Namah Shivaya.":["महाशिवरात्रि की शुभकामनाएँ! ॐ नमः शिवाय।","మహాశివరాత్రి శుభాకాంక్షలు! ఓం నమః శివాయ."],"Women’s Day":["महिला दिवस","మహిళా దినోత్సవం"],"Happy International Women’s Day! Here’s to every woman in this group. You are strong, you are capable and you inspire us.":["अंतरराष्ट्रीय महिला दिवस की शुभकामनाएँ! इस समूह की हर महिला के नाम। आप मज़बूत हैं, सक्षम हैं और हमें प्रेरित करती हैं।","అంతర్జాతీయ మహిళా దినోత్సవ శుభాకాంక్షలు! ఈ గ్రూప్‌లోని ప్రతి మహిళకు అభినందనలు. మీరు బలవంతులు, సమర్థులు, మాకు స్ఫూర్తి."],"Eid ul-Fitr":["ईद-उल-फ़ित्र","ఈద్ ఉల్ ఫితర్"],"Eid Mubarak! Wishing you and your family joy and blessings.":["ईद मुबारक! आपको और आपके परिवार को ख़ुशियाँ और बरकत मिले।","ఈద్ ముబారక్! మీకు, మీ కుటుంబానికి ఆనందం, ఆశీస్సులు కలగాలి."],"Holi":["होली","హోలీ"],"Holi is tomorrow! Get your colours ready.":["होली कल है! रंग तैयार कर लीजिए।","హోలీ రేపే! రంగులు సిద్ధం చేసుకోండి."],"Happy Holi! May your life be filled with colours of joy.":["होली की शुभकामनाएँ! आपका जीवन ख़ुशियों के रंगों से भर जाए।","హోలీ శుభాకాంక్షలు! మీ జీవితం ఆనంద రంగులతో నిండాలి."],"Ugadi":["उगादि","ఉగాది"],"Happy Ugadi! May the new year bring you good health and happiness.":["उगादि की शुभकामनाएँ! नया साल आपको अच्छी सेहत और ख़ुशी दे।","ఉగాది శుభాకాంక్షలు! కొత్త సంవత్సరం మీకు మంచి ఆరోగ్యం, ఆనందం ఇవ్వాలి."],"Rama Navami":["राम नवमी","శ్రీరామ నవమి"],"Happy Rama Navami! Jai Shri Ram.":["राम नवमी की शुभकामनाएँ! जय श्री राम।","శ్రీరామ నవమి శుభాకాంక్షలు! జై శ్రీరామ్."],"Independence Day":["स्वतंत्रता दिवस","స్వాతంత్ర్య దినోత్సవం"],"Happy Independence Day! Jai Hind.":["स्वतंत्रता दिवस की शुभकामनाएँ! जय हिंद।","స్వాతంత్ర్య దినోత్సవ శుభాకాంక్షలు! జై హింద్."],"Raksha Bandhan":["रक्षाबंधन","రక్షా బంధన్"],"Happy Raksha Bandhan! Wishing everyone a day full of love and good wishes.":["रक्षाबंधन की शुभकामनाएँ! सबका दिन प्यार और शुभकामनाओं से भरा हो।","రక్షా బంధన్ శుభాకాంక్షలు! అందరికీ ప్రేమ, శుభాకాంక్షలతో నిండిన రోజు కావాలి."],"Janmashtami":["जन्माष्टमी","జన్మాష్టమి"],"Happy Janmashtami! May Lord Krishna bless you and your family.":["जन्माष्टमी की शुभकामनाएँ! भगवान कृष्ण आपको और आपके परिवार को आशीर्वाद दें।","జన్మాష్టమి శుభాకాంక్షలు! శ్రీకృష్ణుడు మిమ్మల్ని, మీ కుటుంబాన్ని ఆశీర్వదించుగాక."],"Ganesh Chaturthi":["गणेश चतुर्थी","వినాయక చవితి"],"Happy Ganesh Chaturthi! Ganpati Bappa Morya!":["गणेश चतुर्थी की शुभकामनाएँ! गणपति बप्पा मोरया!","వినాయక చవితి శుభాకాంక్షలు! గణపతి బప్పా మోరియా!"],"Onam":["ओणम","ఓనం"],"Happy Onam! Wishing you a joyful festival.":["ओणम की शुभकामनाएँ! आपका त्योहार आनंदमय हो।","ఓనం శుభాకాంక్షలు! మీకు ఆనందమయమైన పండుగ కావాలి."],"Happy Navratri! May Maa Durga bless you with strength and joy.":["नवरात्रि की शुभकामनाएँ! माँ दुर्गा आपको शक्ति और ख़ुशी का आशीर्वाद दें।","నవరాత్రి శుభాకాంక్షలు! దుర్గామాత మీకు శక్తి, ఆనందం ప్రసాదించుగాక."],"Diwali is tomorrow! Wishing you light and happiness.":["दिवाली कल है! आपको रोशनी और ख़ुशियाँ मिलें।","దీపావళి రేపే! మీకు వెలుగు, సంతోషం కలగాలి."],"Saved":["सहेजा गया","సేవ్ అయింది"],"Antakshari":["अंताक्षरी","అంత్యాక్షరి"],"Two teams. One team sings a song, the other must sing a song starting with its last letter.":["दो टीमें। एक टीम गाना गाए, दूसरी उसके आख़िरी अक्षर से शुरू होने वाला गाना गाए।","రెండు టీమ్‌లు. ఒక టీమ్ పాట పాడితే, రెండో టీమ్ ఆ పాట చివరి అక్షరంతో మొదలయ్యే పాట పాడాలి."],"Contribution for one share, each month":["एक हिस्से का मासिक अंशदान","ఒక వాటాకు నెలవారీ చందా"],"Each share pays the same amount every month. Pool each month = number of shares × this amount.":["हर हिस्सा हर महीने उतनी ही रकम देता है। हर महीने की कुल रकम = हिस्सों की संख्या × यह रकम।","ప్రతి వాటా ప్రతి నెల అదే మొత్తం చెల్లిస్తుంది. ప్రతి నెల మొత్తం = వాటాల సంఖ్య × ఈ మొత్తం."],"Due on day":["देय तारीख़ (दिन)","చెల్లింపు తేదీ (రోజు)"],"Grace days":["छूट के दिन","గ్రేస్ రోజులు"],"Payout day":["भुगतान का दिन","చెల్లింపు రోజు"],"Who collects each month’s money?":["हर महीने का पैसा कौन लेती है?","ప్రతి నెల డబ్బును ఎవరు తీసుకుంటారు?"],"The winner collects directly":["विजेता सीधे लेती है","విజేత నేరుగా తీసుకుంటుంది"],"The treasurer collects":["कोषाध्यक्ष लेती हैं","ట్రెజరర్ తీసుకుంటారు"],"The other members pay the month’s winner directly. Each online payment needs a screenshot, either the UPI payment or the WhatsApp confirmation. The winner confirms it and the treasurer can step in. Everyone sees who has paid.":["बाक़ी सदस्य महीने की विजेता को सीधे पैसे देते हैं। हर ऑनलाइन भुगतान के लिए स्क्रीनशॉट चाहिए, UPI भुगतान का या WhatsApp पुष्टि का। विजेता पुष्टि करती है और कोषाध्यक्ष मदद कर सकती हैं। सबको दिखता है किसने दिया।","మిగతా సభ్యులు ఆ నెల విజేతకు నేరుగా చెల్లిస్తారు. ప్రతి ఆన్‌లైన్ చెల్లింపుకు UPI చెల్లింపు లేదా WhatsApp నిర్ధారణ స్క్రీన్‌షాట్ కావాలి. విజేత నిర్ధారిస్తారు, ట్రెజరర్ జోక్యం చేసుకోవచ్చు. ఎవరు చెల్లించారో అందరికీ కనిపిస్తుంది."],"Late fine":["देर से भुगतान का जुर्माना","ఆలస్య జరిమానా"],"No fine":["कोई जुर्माना नहीं","జరిమానా లేదు"],"Fixed amount":["तय रकम","నిర్ణీత మొత్తం"],"Percent":["प्रतिशत","శాతం"],"Give the party a name.":["पार्टी को एक नाम दीजिए।","పార్టీకి ఒక పేరు పెట్టండి."],"Pick the two tea days first, then tap Create.":["पहले चाय के दो दिन चुनें, फिर बनाएँ दबाएँ।","ముందు రెండు టీ రోజులు ఎంచుకుని, తర్వాత సృష్టించు నొక్కండి."],"You are the winner this month. The others pay you directly. Confirm each payment when the money reaches you.":["इस महीने की विजेता आप हैं। बाक़ी सदस्य आपको सीधे पैसे देंगे। पैसे मिलते ही हर भुगतान की पुष्टि करें।","ఈ నెల విజేత మీరే. మిగతావారు మీకు నేరుగా చెల్లిస్తారు. డబ్బు చేరినప్పుడు ప్రతి చెల్లింపును నిర్ధారించండి."],"Tell the members where to pay you.":["सदस्यों को बताइए कि आपको कहाँ पैसे भेजने हैं।","మీకు ఎక్కడ చెల్లించాలో సభ్యులకు చెప్పండి."],"How should others pay me?":["बाक़ी लोग मुझे कैसे पैसे दें?","ఇతరులు నాకు ఎలా చెల్లించాలి?"],"Send to WhatsApp":["WhatsApp पर भेजें","WhatsApp కు పంపండి"],"Copy":["कॉपी करें","కాపీ చేయండి"],"Pay":["भुगतान करें","చెల్లించండి"],"How":["कैसे","ఎలా"],"Transaction or reference ID, optional":["लेन-देन या संदर्भ आईडी (ज़रूरी नहीं)","లావాదేవీ లేదా రిఫరెన్స్ ID (ఐచ్ఛికం)"],"Screenshot of the payment (UPI or WhatsApp)":["भुगतान का स्क्रीनशॉट (UPI या WhatsApp)","చెల్లింపు స్క్రీన్‌షాట్ (UPI లేదా WhatsApp)"],"Take or choose screenshot":["स्क्रीनशॉट लें या चुनें","స్క్రీన్‌షాట్ తీయండి లేదా ఎంచుకోండి"],"Note, optional":["नोट (ज़रूरी नहीं)","గమనిక (ఐచ్ఛికం)"],"if you have it":["अगर आपके पास हो","ఉంటే"],"Amount paid":["चुकाई गई रकम","చెల్లించిన మొత్తం"],"Proof":["सबूत","రుజువు"],"Reference ID, optional":["संदर्भ आईडी (ज़रूरी नहीं)","రిఫరెన్స్ ID (ఐచ్ఛికం)"],"When you save, this payment counts as paid straight away. It is written in the log with your name.":["सहेजते ही यह भुगतान तुरंत चुकाया हुआ गिना जाएगा। यह आपके नाम के साथ लॉग में दर्ज होगा।","సేవ్ చేయగానే ఈ చెల్లింపు వెంటనే చెల్లించినట్లు లెక్కవుతుంది. మీ పేరుతో లాగ్‌లో నమోదవుతుంది."],"Save as paid":["चुकाया हुआ सहेजें","చెల్లించినట్లు సేవ్ చేయండి"],"Only the name changes. Money, draw and history stay as they are. Everyone can see the change in the log.":["सिर्फ़ नाम बदलता है। पैसा, ड्रॉ और इतिहास जैसे हैं वैसे रहते हैं। बदलाव सबको लॉग में दिखता है।","పేరు మాత్రమే మారుతుంది. డబ్బు, డ్రా, చరిత్ర అలాగే ఉంటాయి. మార్పు లాగ్‌లో అందరికీ కనిపిస్తుంది."],"New name":["नया नाम","కొత్త పేరు"],"Pick any whole number from 1 to 9999. All numbers are mixed into the draw seed, so nobody can steer it. Numbers stay hidden until the draw.":["1 से 9999 के बीच कोई भी पूर्ण संख्या चुनें। सभी संख्याएँ ड्रॉ के सीड में मिलाई जाती हैं, इसलिए कोई नतीजा नहीं बदल सकता। ड्रॉ तक संख्याएँ छिपी रहती हैं।","1 నుండి 9999 మధ్య ఏదైనా పూర్ణ సంఖ్య ఎంచుకోండి. అన్ని సంఖ్యలు డ్రా సీడ్‌లో కలుస్తాయి కాబట్టి ఎవరూ ఫలితాన్ని మార్చలేరు. డ్రా వరకు సంఖ్యలు దాగి ఉంటాయి."],"Pick one for me":["मेरे लिए चुन दें","నా కోసం ఒకటి ఎంచండి"],"Save number":["संख्या सहेजें","సంఖ్యను సేవ్ చేయండి"],"Record consent":["सहमति दर्ज करें","సమ్మతిని నమోదు చేయండి"],"Tick the members who agreed to these rules, and say how. The log will show you recorded it, with the date. They can still sign in the app later.":["जिन सदस्यों ने इन नियमों पर सहमति दी है उन पर निशान लगाएँ और बताएँ कैसे। लॉग में तारीख़ के साथ दिखेगा कि आपने दर्ज किया। वे बाद में ऐप में साइन इन भी कर सकती हैं।","ఈ నియమాలకు అంగీకరించిన సభ్యులను టిక్ చేసి, ఎలా అంగీకరించారో చెప్పండి. మీరు నమోదు చేసినట్లు తేదీతో లాగ్‌లో కనిపిస్తుంది. వారు తర్వాత యాప్‌లో సైన్ ఇన్ కూడా చేయవచ్చు."],"How did they agree?":["उन्होंने कैसे सहमति दी?","వారు ఎలా అంగీకరించారు?"],"Date they agreed":["सहमति की तारीख़","అంగీకరించిన తేదీ"],"for example said yes on the 3rd":["जैसे 3 तारीख़ को हाँ कहा","ఉదా. 3వ తేదీన అవును అన్నారు"],"for example rain":["जैसे बारिश","ఉదా. వర్షం"],"Each member adds a lucky number. The app mixes all numbers into one seed, so nobody can steer the result.":["हर सदस्य एक लकी नंबर जोड़ती है। ऐप सभी संख्याओं को एक सीड में मिलाता है, इसलिए नतीजा कोई नहीं बदल सकता।","ప్రతి సభ్యురాలు ఒక లక్కీ నంబర్ చేర్చుతుంది. యాప్ అన్ని సంఖ్యలను ఒక సీడ్‌లో కలుపుతుంది, కాబట్టి ఎవరూ ఫలితాన్ని మార్చలేరు."],"Not yet":["अभी नहीं","ఇంకా లేదు"],"Add":["जोड़ें","చేర్చండి"],"Draw mode:":["ड्रॉ का तरीक़ा:","డ్రా విధానం:"],"Fill missing numbers":["छूटी संख्याएँ भरें","లేని సంఖ్యలను నింపండి"],"Makes a random number for each member who has not added one. The log records it.":["जिस सदस्य ने संख्या नहीं जोड़ी उसके लिए एक यादृच्छिक संख्या बनाता है। लॉग में दर्ज होता है।","సంఖ్య చేర్చని ప్రతి స   return s.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,function(m){var i=MONK.indexOf(m);return (l==='zh'||l==='ja')?(i+1)+'月':(MONN[l]?MONN[l][i]:m);});
}

  /* ---------- LITE fix 1: Paste place takes the real name from a Google Maps share ---------- */
  parsePlace=function(t){
    var m=/https?:\/\/\S+/.exec(String(t||''));if(!m)return null;
    var url=m[0].replace(/[)\].,;]+$/,''),before=t.slice(0,m.index).split(/\n/).map(function(x){return x.trim();}).filter(Boolean);
    var name=(before[0]||'').replace(/\s+[-–|]\s+.*$/,'').replace(/\s*,.*$/,'').trim();
    if(!name){
      try{
        var u=decodeURIComponent(url),pm=/\/maps\/place\/([^\/@?]+)/.exec(u)||/[?&](?:q|query)=([^&]+)/.exec(u);
        if(pm){var q=pm[1].replace(/\+/g,' ').trim();if(!/^-?\d+(\.\d+)?,\s*-?\d+/.test(q))name=q;}
      }catch(e){}
    }
    return {name:name.slice(0,60),url:url};
  };
  /* ---------- LITE fix 1b: Place = plain text box + Place link box + Search on Google / Ask Sakhi ---------- */
  placeSug=function(){};  /* no suggestion list: the Place box is a plain text box */
  var urlOf=function(t){var m=/https?:\/\/\S+/.exec(String(t||''));return m?m[0].replace(/[)\].,;]+$/,''):'';};
  var plNote=function(t){var n=document.getElementById('pmapsnote');if(n)n.textContent=t||'';};
  var plBlock=function(place,link,note){
    return '<label class="f">Place, optional<input id="pplace" maxlength="600" value="'+esc(place||'')+'" placeholder="Type the place name, or anything" autocomplete="off"></label>'
     +'<label class="f">Place link from Google Maps, optional<textarea id="pmaplink" rows="2" placeholder="Paste the Google Maps link here" autocomplete="off">'+esc(link||'')+'</textarea></label>'
     +'<div id="pmapsnote" class="tiny mute">'+esc(note||'')+'</div>'
     +'<div class="row" style="flex-wrap:nowrap"><a id="pgs" class="btn sm" style="flex:1;text-decoration:none;display:flex;justify-content:center;align-items:center" target="_blank" rel="noopener" href="#" data-act="pgs">🔍 Search on Google Maps</a><button class="btn sm" style="flex:1" data-act="pask">✨ Ask Sakhi</button></div>'
     +'<div class="tiny mute">On Google Maps tap Share, then Copy, and paste the link above. The place name fills in by itself. Or ask Sakhi, then tap Use this place.</div>';
  };
  /* a short link (maps.app.goo.gl) has no name in it: open it through a public relay and read the place name */
  var plFetch=function(url,ms){
    var ctl=(typeof AbortController!=='undefined')?new AbortController():null,tm=setTimeout(function(){try{ctl&&ctl.abort();}catch(e){}},ms||9000);
    return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error('http');return r.text();},function(e){clearTimeout(tm);throw e;});
  };
  var plClean=function(t){
    t=String(t||'').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/\s*[-–·|]\s*Google Maps.*$/i,'').replace(/\s*[-–·|]\s*.*$/,'').replace(/\s*,.*$/,'').trim();
    return (!t||/^google maps$/i.test(t)||/before you continue|^google$|sign in/i.test(t))?'':t.slice(0,60);
  };
  var plNameFrom=function(finalUrl,body){
    if(finalUrl){var q=parsePlace(finalUrl);if(q&&q.name)return q.name;}
    body=String(body||'');
    var m=/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)/i.exec(body)||/<title[^>]*>([^<]+)/i.exec(body);
    return m?plClean(m[1]):'';
  };
  var plResolve=function(u,cb){
    var tries=[
      function(){return plFetch('https://api.allorigins.win/get?url='+encodeURIComponent(u)).then(function(t){var j={};try{j=JSON.parse(t);}catch(e){}return plNameFrom(j.status&&j.status.url,j.contents);});},
      function(){return plFetch('https://corsproxy.io/?'+encodeURIComponent(u)).then(function(t){return plNameFrom('',t);});}
    ],i=0;
    (function next(){if(i>=tries.length)return cb('');tries[i++]().then(function(n){if(n)cb(n);else next();},function(){next();});})();
  };
  /* a link pasted (or a Maps share text) fills the link box and, when it can, the Place box */
  var plApply=function(raw,fromPlace){

  /* --- understanding typing mistakes and plain words --- */
  var skLev=function(a,b){
    var m=a.length,n=b.length,d=[],i,j;if(Math.abs(m-n)>2)return 9;
    for(i=0;i<=m;i++){d[i]=[i];}for(j=1;j<=n;j++)d[0][j]=j;
    for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    return d[m][n];
  };
  var skTok=function(t){return String(t||'').toLowerCase().replace(/[^a-z0-9ऀ-෿ ]+/g,' ').split(/\s+/).filter(Boolean);};
  var skNear=function(tok,kw){
    if(tok===kw)return true;if(kw.length<=3)return false;
    if(tok.indexOf(kw)===0&&tok.length<=kw.length+3)return true;
    if(tok.charAt(0)!==kw.charAt(0))return false;
    if(tok.length===kw.length&&tok.split('').sort().join('')===kw.split('').sort().join(''))return true;
    return skLev(tok,kw)<=(kw.length>=7?2:1);
  };
  var skHas=function(toks,kws){return kws.some(function(k){return toks.some(function(t){return skNear(t,k);});});};
  var skGameFind=function(toks,asking){
    var best=null,bs=0;
    SK_GAMES.forEach(function(g){
      var gt=skTok(g[0]).filter(function(w){return w.length>=3&&w!=='the'&&w!=='and';}),hit=0,long=0;
      gt.forEach(function(w){if(toks.some(function(t){return skNear(t,w);})){hit++;if(w.length>=4)long++;}});
      var sc=gt.length?hit/gt.length:0;
      if(long>=1&&sc>bs){bs=sc;best=g;}
    });
    return bs>=(asking?0.33:0.6)?best:null;
  };

    var bm=/budget is about\s*(\d[\d,]*)/.exec(low),budget=bm?bm[1].replace(/,/g,''):'';
    /* greetings and thanks */
    if(toks.length<=3&&skHas(toks,['hi','hello','hey','hii','namaste','namaskaram'])){skList();skAdd('a','Hi! I am Sakhi. What would you like help with?');skOpts(skMain());return;}
    if(toks.length<=4&&skHas(toks,['thanks','thank','thx','shukriya','dhanyavad'])){skList();skAdd('a','You are welcome! Ask me anything else about the party.');return;}
    /* a game by name, or how to play */
